ge = 1;\n+                    } else if self.stage == 1 {\n+                        self.stage = 2;\n+                    }\n+                }\n+            }\n+            0x01 if p.len() >= 3 => {\n+                self.note(\"hci\", p);\n+                if p[1] == 0x1F && p[2] == 0x20 {\n+                    self.push(&[0x04, 0x0E, 6, 0x01, p[1], p[2], 0x00, 0, 0]);\n+                } else {\n+                    self.push(&[0x04, 0x0E, 4, 0x01, p[1], p[2], 0x00]);\n+                }\n+            }\n+            _ => self.note(\"other\", p),\n+        }\n+    }\n+\n+    /// A write from the phone (characteristic fff2). False if there is no room yet.\n+    pub fn from_phone(&mut self, d: &[u8]) -> bool {\n+        if d.is_empty() {\n+            return true;\n+        }\n+        if self.queue.len() + d.len() + 2 > 2048 {\n+            return false;\n+        }\n+        self.note(\"APP>TOY\", d);\n+        let mut m = vec![0x22, d.len() as u8];\n+        m.extend_from_slice(d);\n+        self.push(&m);\n+        true\n+    }\n+}\ndiff --git a/core/src/sys.rs b/core/src/sys.rs\nindex 6f76746..a4970c0 100644\n--- a/core/src/sys.rs\n+++ b/core/src/sys.rs\n@@ -340,6 +340,8 @@ pub struct System {\n     /// A quick tap stays held until this time.\n     pub hold_until: [f64; 3],\n     pub gpio_applied: [u32; 8],\n+    /// The Bluetooth module, when emulated (None: absent, as before).\n+    pub radio: Option<crate::radio::Radio>,\n \n     pub mmio_writes: u64,\n     /// Set by memory writes that change a value (idle detection).\n@@ -390,6 +392,7 @@ impl System {\n             live_keys: [false; 3],\n             hold_until: [0.0; 3],\n             gpio_applied: [0; 8],\n+            radio: None,\n             mmio_writes: 0,\n             changed: false,\n             tracking: false,\n@@ -945,7 +948,15 @@ impl System {\n             0xC015_0000 => self.flash_select(new & 0x40 != 0),\n             0xC015_0008 => self.flash_xfer(new as u8),\n             0xC008_0008 