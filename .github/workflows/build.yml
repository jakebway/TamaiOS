          import SwiftUI
          import UniformTypeIdentifiers

          /// Pick a ROM dump, check it, name the toy, pick a colour, hatch.
          struct AddToyView: View {
              let firstRun: Bool
              @EnvironmentObject var model: AppModel
              @Environment(\.dismiss) private var dismiss

              enum Step { case pick, checking, found(RomCheck), failed(ImportError) }
              @State private var step: Step = .pick
              enum AddSheet: String, Identifiable { case picker, help; var id: String { rawValue } }
              @State private var sheet: AddSheet?
              @State private var name = ""
              @State private var color = 0
              @State private var existing: Toy?

              var body: some View {
                  let theme = Theme.of(color)
                  ZStack {
                      LinearGradient(colors: [theme.top, theme.bottom], startPoint: .top, endPoint: .bottom).ignoresSafeArea()
                      ScrollView {
                          VStack(spacing: 22) {
                              if !firstRun {
                                  HStack { Spacer(); Button("Cancel") { dismiss() }.foregroundStyle(theme.ink) }
                              }
                              EggBadge(theme: theme).frame(width: 120, height: 150).padding(.top, firstRun ? 30 : 0)
                              content(theme)
                          }
                          .padding(24)
                          .frame(maxWidth: 520)
                          .frame(maxWidth: .infinity)
                      }
                  }
                  .sheet(item: $sheet) { which in
                      switch which {
                      case .picker: DocumentPicker { check($0) }.ignoresSafeArea()
                      case .help: DumpHelpView()
                      }
                  }
                  .onAppear(perform: takePending)
                  .onChange(of: model.pendingImport) { _ in takePending() }
              }

              @ViewBuilder
              private func content(_ theme: Theme) -> some View {
                  switch step {
                  case .pick:
                      VStack(spacing: 14) {
                          Text(firstRun ? "Welcome to TamaiOS" : "Add a toy")
                              .font(.system(size: 30, weight: .heavy, design: .rounded))
                          Text("Bring your own Tamagotchi ON or Meets to your iPhone. You'll need the 8 MB flash dump you read from your own toy.")
                              .font(.system(.body, design: .rounded))
                              .multilineTextAlignment(.center)
                              .opacity(0.85)
                      }
                      .foregroundStyle(theme.ink)
                      BigButton(title: "Choose my ROM file", icon: "folder.fill", theme: theme) { sheet = .picker }
                      Text("A .bin file, or a .zip with one inside. You can also share it to TamaiOS from Files or AirDrop.")
                          .font(.system(.footnote, design: .rounded)).multilineTextAlignment(.center)
                          .foregroundStyle(theme.ink.opacity(0.75))
                      Button { sheet = .help } label: {
                          Label("How do I get my ROM?", systemImage: "questionmark.circle.fill")
                              .font(.system(.callout, design: .rounded).weight(.semibold))
                      }
                      .foregroundStyle(theme.ink)

                  case .checking:
                      ProgressView().scaleEffect(1.6).tint(theme.ink).padding(30)
                      Text("Checking your file…").font(.system(.headline, design: .rounded)).foregroundStyle(theme.ink)

                  case .found(let c):
                      Card {
                          VStack(alignment: .leading, spacing: 12) {
                              Label(c.known ? "Found \(c.name)" : "Tamagotchi ON / Meets dump", systemImage: "checkmark.seal.fill")
                                  .font(.system(.headline, design: .rounded)).foregroundStyle(.green)
                              if !c.known {
                                  Text("This version isn't one TamaiOS has been tested with. It will probably still work — if it doesn't, use Settings › Console › diag and send the result.")
                                      .font(.system(.footnote, design: .rounded)).foregroundStyle(.secondary)
                              }
                              if let e = existing {
                                  Text("You already have this toy (\"\(e.name)\"). Hatching it again replaces nothing — it just opens your existing one.")
                                      .font(.system(.footnote, design: .rounded)).foregroundStyle(.secondary)
                              } else {
                                  Text("Name").font(.system(.subheadline, design: .rounded).weight(.semibold))
                                  TextField(c.shortName, text: $name)
                                      .textFieldStyle(.roundedBorder)
                                      .font(.system(.body, design: .rounded))
                                  Text("Shell colour").font(.system(.subheadline, design: .rounded).weight(.semibold))
                                  ColorPickerRow(selection: $color)
                              }
                          }
                      }
                      BigButton(title: existing == nil ? "Hatch!" : "Open my toy", icon: "sparkles", theme: theme) { hatch(c) }
                      Button("Choose a different file") { step = .pick }.foregroundStyle(theme.ink)

                  case .failed(let e):
                      Card {
                          VStack(alignment: .leading, spacing: 10) {
                              Label(e.title, systemImage: "exclamationmark.triangle.fill")
                                  .font(.system(.headline, design: .rounded)).foregroundStyle(.orange)
                              Text(e.errorDescription ?? "").font(.system(.body, design: .rounded))
                          }
                      }
                      BigButton(title: "Try another file", icon: "folder.fill", theme: theme) { sheet = .picker }
                      Button { sheet = .help } label: { Label("How do I get my ROM?", systemImage: "questionmark.circle.fill") }
                          .foregroundStyle(theme.ink)
                  }
              }

              private func takePending() {
                  if let u = model.pendingImport {
                      model.pendingImport = nil
                      check(u)
                  }
              }

              private func check(_ url: URL) {
                  step = .checking
                  DispatchQueue.global(qos: .userInitiated).async {
                      let result: Step
                      do {
                          let data = try ToyStore.readPicked(url)
                          result = .found(try ToyStore.check(data))
                      } catch let e as ImportError {
                          result = .failed(e)
                      } catch {
                          result = .failed(.unreadable(error.localizedDescription))
                      }
                      DispatchQueue.main.async {
                          if case .found(let c) = result {
                              existing = model.toys.first { $0.id == c.stem }
                              name = ""
                          }
                          withAnimation(.spring()) { step = result }
                      }
                  }
              }

              private func hatch(_ c: RomCheck) {
                  if let e = existing {
                      model.showAdd = false
                      model.play(e)
                      dismiss()
                      return
                  }
                  do {
                      let toy = try ToyStore.create(c, name: name.trimmingCharacters(in: .whitespaces), color: color)
                      model.added(toy)
                      dismiss()
                  } catch {
                      step = .failed(.unreadable(error.localizedDescription))
                  }
              }
          }

          struct BigButton: View {
              let title: String
              let icon: String
              let theme: Theme
              let action: () -> Void
              var body: some View {
                  Button(action: action) {
                      Label(title, systemImage: icon)
                          .font(.system(.title3, design: .rounded).weight(.bold))
                          .frame(maxWidth: .infinity)
                          .padding(.vertical, 16)
                          .background(Capsule().fill(theme.ink))
                          .foregroundStyle(theme.top)
                          .shadow(color: .black.opacity(0.18), radius: 8, y: 4)
                  }
                  .buttonStyle(.plain)
              }
          }

          struct Card<C: View>: View {
              @ViewBuilder let content: C
              var body: some View {
                  content
                      .padding(18)
                      .frame(maxWidth: .infinity, alignment: .leading)
                      .background(RoundedRectangle(cornerRadius: 22, style: .continuous).fill(.regularMaterial))
              }
          }

          struct ColorPickerRow: View {
              @Binding var selection: Int
              var body: some View {
                  HStack(spacing: 10) {
                      ForEach(Theme.all) { t in
                          Circle()
                              .fill(LinearGradient(colors: [t.top, t.bottom], startPoint: .top, endPoint: .bottom))
                              .frame(width: 38, height: 38)
                              .overlay(Circle().stroke(Color.primary, lineWidth: selection == t.id ? 3 : 0))
                              .onTapGesture { withAnimation { selection = t.id } }
                              .accessibilityLabel(t.name)
                      }
                  }
              }
          }

          /// A small egg for headers.
          struct EggBadge: View {
              let theme: Theme
              var body: some View {
                  GeometryReader { g in
                      ZStack {
                          EggShape().fill(LinearGradient(colors: [theme.top.opacity(0.95), theme.bottom], startPoint: .topLeading, endPoint: .bottomTrailing))
                          EggShape().stroke(Color.white.opacity(0.7), lineWidth: 3)
                          RoundedRectangle(cornerRadius: g.size.width * 0.08)
                              .fill(Color(white: 0.12))
                              .frame(width: g.size.width * 0.46, height: g.size.width * 0.46)
                              .overlay(Text("♥").font(.system(size: g.size.width * 0.2)).foregroundStyle(theme.top))
                              .offset(y: -g.size.height * 0.02)
                      }
                      .shadow(color: .black.opacity(0.2), radius: 10, y: 6)
                  }
              }
          }

          struct DumpHelpView: View {
              @Environment(\.dismiss) private var dismiss
              var body: some View {
                  NavigationStack {
                      DumpHelpContent()
                          .toolbar { ToolbarItem(placement: .confirmationAction) { Button("Done") { dismiss() } } }
                  }
              }
          }

          struct DumpHelpContent: View {
              var body: some View {
                      List {
                          Section("What you need") {
                              Text("A copy (\"dump\") of the 8 MB flash chip inside your own Tamagotchi ON or Tamagotchi Meets. TamaiOS doesn't include any game — it runs the one from your toy.")
                          }
                          Section("How people usually dump it") {
                              Text("1. Open the toy and find the 8-pin flash chip on the board.")
                              Text("2. Clip a CH341A programmer (set to 3.3 V) onto the chip.")
                              Text("3. Read the chip with the programmer's software and save the result as a .bin file. Read it twice and check both files match.")
                              Text("4. Put the .bin in the Files app (iCloud Drive or On My iPhone) or AirDrop it to your phone, then choose it here.")
                          }
                          Section("Works with") {
                              Text("Tamagotchi ON: Fairy, Magic, Wonder Garden (EN)")
                              Text("Tamagotchi Meets: Fairy, Magical, Pastel, Sanrio, Sweets, Fantasy (JP)")
                          }
                          Section("Not available") {
                              Text("Bluetooth (the phone app, downloads, camera) and infrared (playdates, gifts, marriage) can't be used. If you choose them, the toy is put back to just before.")
                          }
                      }
                      .navigationTitle("Getting your ROM")
              }
          }
          TAMA_EOF
          cat > ios/TamaiOS/App.swift <<'TAMA_EOF'
          import SwiftUI
          import UniformTypeIdentifiers
          import UserNotifications

          @main
          struct TamaiOSApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var delegate
              @StateObject private var model = AppModel()
              @Environment(\.scenePhase) private var phase

              init() { Prefs.register() }

              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .environmentObject(model)
                          .environmentObject(model.emu)
                          .onOpenURL { model.open($0) }
                  }
                  .onChange(of: phase) { p in
                      switch p {
                      case .background: model.emu.enterBackground()
                      case .active:
                          model.emu.enterForeground()
                          UIApplication.shared.isIdleTimerDisabled = Prefs.flag("keepAwake")
                      default: break
                      }
                  }
              }
          }

          final class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  UNUserNotificationCenter.current().delegate = self
                  return true
              }
              func applicationWillTerminate(_ application: UIApplication) {
                  AppModel.current?.emu.willTerminate()
              }
              func userNotificationCenter(_ center: UNUserNotificationCenter, willPresent notification: UNNotification,
                                          withCompletionHandler completionHandler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  completionHandler([])  // in the app you can already hear it
              }
          }

          /// The toys and which one is in play.
          final class AppModel: ObservableObject {
              static weak var current: AppModel?
              let emu = Emulator()
              @Published var toys: [Toy] = []
              @Published var showAdd = false
              @Published var pendingImport: URL?
              @Published var pendingBackup: URL?

              init() {
                  // firmware built into the app (firmware/*.bin in the repo): set up its
                  // toy automatically, so there's nothing to import
                  if let t = ToyStore.installBundled(), Prefs.d.string(forKey: "currentToy") == nil {
                      Prefs.d.set(t.id, forKey: "currentToy")
                  }
                  toys = ToyStore.list()
                  AppModel.current = self
                  if let t = currentToy { emu.load(t) }
              }

              var currentToy: Toy? {
                  let id = Prefs.d.string(forKey: "currentToy")
                  return toys.first { $0.id == id } ?? toys.first
              }

              func play(_ toy: Toy) {
                  Prefs.d.set(toy.id, forKey: "currentToy")
                  emu.load(toy)
                  objectWillChange.send()
              }

              func added(_ toy: Toy) {
                  toys = ToyStore.list()
                  showAdd = false
                  play(toy)
                  if Prefs.flag("callAlerts") { Notifier.ask() }
              }

              func update(_ toy: Toy) {
                  ToyStore.save(toy)
                  toys = ToyStore.list()
                  if emu.toy?.id == toy.id { emu.toy = toy }
              }

              func remove(_ toy: Toy) {
                  if emu.toy?.id == toy.id { emu.unload(); emu.toy = nil }
                  ToyStore.delete(toy.id)
                  toys = ToyStore.list()
                  if let t = currentToy { play(t) }
              }

              /// A file shared into the app (Files "Open in", AirDrop, Share sheet).
              func open(_ url: URL) {
                  if url.pathExtension.lowercased() == "tamaios" {
                      pendingBackup = url
                  } else {
                      pendingImport = url
                      showAdd = true
                  }
              }
          }

          struct Theme: Identifiable, Equatable {
              let id: Int
              let name: String
              let top: Color
              let bottom: Color
              let button: Color
              let ink: Color

              static let all: [Theme] = [
                  Theme(id: 0, name: "Bubblegum", top: Color(red: 1.0, green: 0.73, blue: 0.84), bottom: Color(red: 0.96, green: 0.45, blue: 0.66), button: Color(red: 0.99, green: 0.93, blue: 0.62), ink: Color(red: 0.45, green: 0.12, blue: 0.29)),
                  Theme(id: 1, name: "Sky", top: Color(red: 0.70, green: 0.88, blue: 1.0), bottom: Color(red: 0.33, green: 0.62, blue: 0.95), button: Color(red: 1.0, green: 0.82, blue: 0.86), ink: Color(red: 0.09, green: 0.23, blue: 0.45)),
                  Theme(id: 2, name: "Mint", top: Color(red: 0.76, green: 0.97, blue: 0.86), bottom: Color(red: 0.32, green: 0.80, blue: 0.62), button: Color(red: 0.98, green: 0.80, blue: 0.95), ink: Color(red: 0.06, green: 0.33, blue: 0.24)),
                  Theme(id: 3, name: "Lemon", top: Color(red: 1.0, green: 0.96, blue: 0.70), bottom: Color(red: 0.99, green: 0.79, blue: 0.29), button: Color(red: 0.62, green: 0.84, blue: 1.0), ink: Color(red: 0.45, green: 0.30, blue: 0.02)),
                  Theme(id: 4, name: "Lilac", top: Color(red: 0.89, green: 0.82, blue: 1.0), bottom: Color(red: 0.63, green: 0.50, blue: 0.95), button: Color(red: 0.70, green: 0.97, blue: 0.86), ink: Color(red: 0.25, green: 0.14, blue: 0.48)),
                  Theme(id: 5, name: "Midnight", top: Color(red: 0.32, green: 0.33, blue: 0.48), bottom: Color(red: 0.12, green: 0.12, blue: 0.22), button: Color(red: 0.98, green: 0.62, blue: 0.80), ink: Color(red: 0.92, green: 0.92, blue: 1.0)),
              ]
              static func of(_ i: Int) -> Theme { all[max(0, min(i, all.count - 1))] }
          }

          struct RootView: View {
              @EnvironmentObject var model: AppModel

              var body: some View {
                  Group {
                      if model.toys.isEmpty {
                          AddToyView(firstRun: true)
                      } else {
                          ToyView()
                              .sheet(isPresented: $model.showAdd) {
                                  AddToyView(firstRun: false).environmentObject(model).environmentObject(model.emu)
                              }
                      }
                  }
                  .preferredColorScheme(nil)
              }
          }
          TAMA_EOF
          cat > ios/TamaiOS/Audio.swift <<'TAMA_EOF'
          import AVFoundation
          import os

          /// Plays the toy's buzzer. The emulator thread pushes 44.1 kHz samples into a
          /// ring buffer; the audio thread pulls them. A small cushion is kept against
          /// dropouts, and extra delay is trimmed so beeps stay in time with the screen.
          final class AudioOut {
              static let rate = 44100.0
              private let engine = AVAudioEngine()
              private var node: AVAudioSourceNode!
              private let cap = 44100 * 2
              private var ring: UnsafeMutablePointer<Float>
              private var head = 0, count = 0
              private let lock: UnsafeMutablePointer<os_unfair_lock>
              private var priming = true
              var muted = false
              var minFill = 0.05
              var maxFill = 0.12
              private(set) var underruns = 0
              private(set) var started = false
              var backgroundMode = true

              init() {
                  ring = .allocate(capacity: cap)
                  ring.initialize(repeating: 0, count: cap)
                  lock = .allocate(capacity: 1)
                  lock.initialize(to: os_unfair_lock())
                  let fmt = AVAudioFormat(standardFormatWithSampleRate: AudioOut.rate, channels: 1)!
                  node = AVAudioSourceNode(format: fmt) { [unowned self] _, _, frames, abl -> OSStatus in
                      let bufs = UnsafeMutableAudioBufferListPointer(abl)
                      guard let out = bufs[0].mData?.assumingMemoryBound(to: Float.self) else { return noErr }
                      self.pull(out, Int(frames))
                      return noErr
                  }
                  engine.attach(node)
                  engine.connect(node, to: engine.mainMixerNode, format: fmt)
                  NotificationCenter.default.addObserver(forName: AVAudioSession.interruptionNotification, object: nil, queue: .main) { [weak self] n in
                      guard let self else { return }
                      let raw = n.userInfo?[AVAudioSessionInterruptionTypeKey] as? UInt ?? 0
                      let type = AVAudioSession.InterruptionType(rawValue: raw)
                      if type == .ended { self.restart() }
                  }
                  NotificationCenter.default.addObserver(forName: .AVAudioEngineConfigurationChange, object: engine, queue: .main) { [weak self] _ in
                      self?.restart()
                  }
              }

              private func pull(_ out: UnsafeMutablePointer<Float>, _ n: Int) {
                  os_unfair_lock_lock(lock)
                  if priming && Double(count) >= minFill * AudioOut.rate { priming = false }
                  var i = 0
                  if !priming {
                      while i < n && count > 0 {
                          out[i] = muted ? 0 : ring[head]
                          head = (head + 1) % cap
                          count -= 1
                          i += 1
                      }
                      if i < n { priming = true; underruns += 1 }
                  }
                  os_unfair_lock_unlock(lock)
                  while i < n { out[i] = 0; i += 1 }
              }

              func push(_ s: UnsafePointer<Int16>, _ n: Int) {
                  guard n > 0 else { return }
                  os_unfair_lock_lock(lock)
                  for k in 0..<n {
                      if count == cap { head = (head + 1) % cap; count -= 1 }
                      ring[(head + count) % cap] = Float(s[k]) / 32768.0
                      count += 1
                  }
                  let high = Int(maxFill * AudioOut.rate), low = Int(minFill * AudioOut.rate)
                  if count > high {
                      let drop = count - low
                      head = (head + drop) % cap
                      count -= drop
                  }
                  os_unfair_lock_unlock(lock)
              }

              var queued: Int {
                  os_unfair_lock_lock(lock); defer { os_unfair_lock_unlock(lock) }
                  return count
              }

              func configureSession() {
                  let s = AVAudioSession.sharedInstance()
                  // .playback keeps the app alive in the background (the pet keeps
                  // living); mixWithOthers so music/podcasts keep playing.
                  if backgroundMode {
                      try? s.setCategory(.playback, mode: .default, options: [.mixWithOthers])
                  } else {
                      try? s.setCategory(.ambient, mode: .default, options: [.mixWithOthers])
                  }
                  try? s.setActive(true)
              }

              func start() {
                  configureSession()
                  if !engine.isRunning {
                      engine.prepare()
                      do { try engine.start(); started = true } catch { started = false }
                  }
              }

              func stop() {
                  engine.pause()
                  started = false
              }

              func restart() {
                  engine.stop()
                  start()
              }

              var isRunning: Bool { engine.isRunning }

              /// A short test beep (console: "beep").
              func beep() {
                  var buf = [Int16](repeating: 0, count: 8820)
                  for i in 0..<buf.count { buf[i] = (i / 20) % 2 == 0 ? 8000 : -8000 }
                  buf.withUnsafeBufferPointer { push($0.baseAddress!, $0.count) }
              }
          }
