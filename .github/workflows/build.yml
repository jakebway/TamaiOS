        /// Write the toy's own flash save to `path` (+ path.json).
        #[no_mangle]
        pub extern "C" fn tg_flash_save(e: *mut Emu, path: *const c_char) -> i32 {
            let path = match unsafe { cstr(path) } {
                Some(p) => p,
                None => return 0,
            };
