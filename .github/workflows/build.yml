               "..XXWWWWWWXX..",
               ".XWWWWWWWWWWX.",
               "XWWWKWWWWKWWWX",
               "XWWWKWWWWKWWWX",
               "XWPPWWWWWWPPWX",
               "XWWWWWKKWWWWWX",
               ".XWWWWWWWWWWX.",
               "..XXWXXXXWXX..",
               "....X....X...."]
