                      guard let t = emu.toy else { return noToy }
                      let town = Town.shared
                      var x = town.state(t)
                      switch args.first ?? "" {
                      case "home": x.away = false; x.pending = .none; x.suitor = nil
                      case "away": x.away = true; x.pending = .none
                      case "reset": x = Town.State()
                      default: break
                      }
                      DispatchQueue.main.async { town.save(x, t) }
                      let v = town.visitData(t)
                      return "pack: \(town.pack)  characters: \(town.ids.count)\naway: \(x.away)  pending: \(x.pending.rawValue)  partner: \(x.suitor?.name ?? "-")\nvisit data: \(v.count) bytes  weddings: \(x.married.count)"

                  case "beep":
                      emu.audio.beep()
                      return "beep (audio running: \(emu.audio.isRunning), queued: \(emu.audio.queued))"

                  case "audio":
                      emu.audio.restart()
                      return "audio restarted (running: \(emu.audio.isRunning), underruns: \(emu.audio.underruns))"

                  case "notify":
                      Notifier.ask { ok in
                          if ok { DispatchQueue.main.asyncAfter(deadline: .now() + 5) { Notifier.postCall(name: emu.toy?.name ?? "Test") } }
                      }
                      return "test notification in 5 s — lock your phone or leave the app"

                  case "perf":
                      let s = emu.stats
                      return "ticks: \(s.ticks)  last tick: \(String(format: "%.2f", s.lastTickMs)) ms  frames published: \(s.frames)  audio queued: \(emu.audio.queued)  underruns: \(emu.audio.underruns)"

                  case "redraw":
                      emu.forceRedraw()
                      return "redrawn"

                  default:
                      return "unknown command \"\(cmd)\" — type help"
                  }
              }

              private func set(_ name: String, _ value: String, emu: Emulator) -> String {
                  let lower = value.lowercased()
                  var parsed: Double? = Double(value)
                  if parsed == nil && ["on", "true", "yes"].contains(lower) { parsed = 1 }
                  if parsed == nil && ["off", "false", "no"].contains(lower) { parsed = 0 }
                  guard let v = parsed else { return "value must be a number or on/off" }
                  if let ak = Console.appKeys[name] {
                      Prefs.d.set(v, forKey: ak)
                      emu.applySettings()
                      return "\(name) = \(v)"
                  }
                  if Console.coreKeys.contains(name) {
                      let ok = emu.withCore { h in name.withCString { tg_set_param(h, $0, v) } } ?? 1
                      guard ok == 1 else { return "core rejected \(name)" }
                      var p = Prefs.coreParams; p[name] = v; Prefs.coreParams = p
                      return "\(name) = \(v) (saved, re-applied at every boot)"
                  }
                  return "unknown parameter \(name) — type \"params\""
              }

              private func key(_ s: String) -> TGKey? {
                  switch s.uppercased() { case "A": return .a; case "B": return .b; case "C": return .c; default: return nil }
              }

              private func hex(_ s: String) -> UInt32? {
                  UInt32(s.lowercased().replacingOccurrences(of: "0x", with: ""), radix: 16)
              }

              private func hexBytes(_ s: String) -> [UInt8] {
                  let clean = s.lowercased().replacingOccurrences(of: "0x", with: "").filter { $0.isHexDigit }
                  var out: [UInt8] = []
                  var i = clean.startIndex
                  while i < clean.endIndex, let j = clean.index(i, offsetBy: 2, limitedBy: clean.endIndex) {
                      if let b = UInt8(clean[i..<j], radix: 16) { out.append(b) }
                      i = j
                  }
                  return out
              }

              private func seconds(_ s: String) -> Double? {
                  let l = s.lowercased()
                  let mult: [(String, Double)] = [("d", 86400), ("h", 3600), ("m", 60), ("s", 1)]
                  for (suf, m) in mult where l.hasSuffix(suf) {
                      if let v = Double(l.dropLast()) { return v * m }
                  }
                  return Double(l)
              }

              private func hexdump(_ b: [UInt8], base: UInt32) -> String {
                  stride(from: 0, to: b.count, by: 16).map { o in
                      let row = b[o..<min(o + 16, b.count)]
                      let hx = row.map { String(format: "%02X", $0) }.joined(separator: " ")
                      let asc = String(row.map { (32...126).contains($0) ? Character(UnicodeScalar($0)) : "." })
                      return String(format: "%08X  ", base &+ UInt32(o)) + hx + "  " + asc
                  }.joined(separator: "\n")
              }

              func diagnostics(_ emu: Emulator) -> String {
                  let info = Bundle.main.infoDictionary
                  var lines = [
                      "== TamaiOS diagnostics ==",
                      "app: \(info?["CFBundleShortVersionString"] ?? "?") (\(info?["CFBundleVersion"] ?? "?"))",
                      "iOS: \(UIDevice.current.systemVersion)  device: \(deviceModel())",
                      "date: \(Date())  tz: \(TimeZone.current.identifier)",
                      "toy: \(emu.toy.map { "\($0.name) / \($0.romName) / \($0.id) known=\($0.known)" } ?? "none")",
                      "stopped: \(emu.stopped.map { "\($0.code)" } ?? "no")  loading: \(emu.loading)  dark: \(emu.dark)",
                      "audio running: \(emu.audio.isRunning) queued: \(emu.audio.queued) underruns: \(emu.audio.underruns)",
                      "-- params --", run("params", emu: emu),
                      "-- autorun --", run("autorun", emu: emu),
                      "-- perf --", run("perf", emu: emu),
                      "-- files --", run("files", emu: emu),
                      "-- core status --", run("status", emu: emu),
                      "-- core log (last 40) --", run("log 40", emu: emu),
                      "-- app log (last 40) --", run("applog 40", emu: emu),
                  ]
                  lines.append("== end ==")
                  return lines.joined(separator: "\n")
              }

              private func deviceModel() -> String {
                  var s = utsname(); uname(&s)
                  return withUnsafeBytes(of: &s.machine) { raw -> String in
                      let bytes = raw.prefix { b in b != 0 }
                      return String(decoding: bytes, as: UTF8.self)
                  }
              }

              static let help = """
              Paste one command per line (# for comments). Changes persist.
              INFO
                diag                 everything, copied to clipboard (send to Claude)
                status | perf | params | files
                log [n]  applog [n]  firmware / app log
              TOY
                press A|B|C [ms]     keys ABBC [gap_ms]   release
                wake  sleep  restart  reload  sync  advance 2h  unstop  save
                restorebak           undo the last backup restore
                rm <file>            delete a save file (autosave.t18s, game.flash…)
              TUNING (persisted)
                set <name> <value>   unset <name>   reset
                  app:  tick_ms audio_min_ms audio_max_ms gap_s autosave_s fps call_gap_s volume
                  core: max_step max_behind max_catchup min_hold rewind_gap idle_skip never_sleep stop_on_bluetooth
                flag <name> on|off   soundOn haptics liveInBackground callAlerts keepAwake neverSleep showHints
                autorun add <cmd> | autorun list | autorun clear   (runs after every boot)
              MEMORY
                peek <hexaddr> [len]   poke <hexaddr> <hexbytes>   str <hexaddr>
              OTHER
                town [home|away|reset]  Town state (away/pending)
                radio [log|on|off]   beep  audio  notify  redraw  clear
              """
          }
          TAMA_EOF
          cat > ios/TamaiOS/Emulator.swift <<'TAMA_EOF'
          import Foundation
          import UIKit
          import QuartzCore
          import UserNotifications

          enum Prefs {
              static let d = UserDefaults.standard
              static func register() {
                  d.register(defaults: [
                      "soundOn": true, "volume": 0.6, "haptics": true, "liveInBackground": true,
                      "callAlerts": true, "keepAwake": true, "neverSleep": false, "showHints": true,
                      "p.tick_ms": 4.0, "p.sleep_tick_ms": 20.0, "p.audio_min_ms": 30.0, "p.audio_max_ms": 80.0,
                      "p.gap_s": 2.0, "p.autosave_s": 180.0, "p.fps": 60.0, "p.call_gap_s": 600.0,
                  ])
              }
              static func num(_ k: String) -> Double { d.double(forKey: k) }
              static func flag(_ k: String) -> Bool { d.bool(forKey: k) }
              /// Emulator-core tunables set from the console, re-applied at every boot.
              static var coreParams: [String: Double] {
                  get { d.dictionary(forKey: "core.params") as? [String: Double] ?? [:] }
                  set { d.set(newValue, forKey: "core.params") }
              }
              /// Console commands run after every boot.
              static var autorun: [String] {
                  get { d.stringArray(forKey: "autorun") ?? [] }
                  set { d.set(newValue, forKey: "autorun") }
              }
          }

          enum TGKey: Int32 { case a = 0, b = 1, c = 2 }

          struct StopInfo: Equatable {
              let code: Int32
              var title: String {
                  switch code {
                  case 4: return "Your toy crashed"
                  case 5: return "Your toy froze"
                  default: return "The emulator hit a problem"
                  }
              }
          }

          /// Owns the running toy: a background thread runs the emulator core and
          /// publishes the screen; everything that touches the core holds `lock`.
          final class Emulator: ObservableObject {
              /// The latest screen image, read straight by the LCD layer (no SwiftUI redraw per frame).
              let frames = FrameSink()
              @Published var dark = false
              @Published var toast: String?
              @Published var stopped: StopInfo?
              @Published var loading = false
              @Published var toy: Toy?
              @Published var calling = false
              /// The toy is on "WAITING FOR APP CONNECT" (Connection › App).
              @Published var appWaiting = false

              let audio = AudioOut()
              private let lock = NSLock()
              private var handle: OpaquePointer?
              private var currentID: String?
              private var thread: Thread?
              private var stopFlag = false
              private var paused = false
              /// The Tama App screen is open: while the toy waits for the app, hold its
              /// time still so it doesn't give up waiting while you look around.
              var holdForApp = false
              /// A Bluetooth exchange is running (the toy must keep running then).
              var linkBusy = false
              private var visible = true
              private var backgroundAt: Date?
              private var lastCall = Date.distantPast
              private var lastCode: Int32 = 0
              private let wake = DispatchSemaphore(value: 0)
              private let inputLock = NSLock()
              private var inputQ: [(Int32, Bool, Double)] = []
              private var toastWork: DispatchWorkItem?
              private var lastDark = false
              private var syncAnnounced = false
              private(set) var stats = (ticks: 0, lastTickMs: 0.0, frames: 0)
              var appLog: [String] = []

              // MARK: core access

              /// Run `body` with the core locked. Returns nil if no toy is running.
              @discardableResult
              func withCore<T>(_ body: (OpaquePointer) -> T) -> T? {
                  lock.lock(); defer { lock.unlock() }
                  guard let h = handle else { return nil }
                  return body(h)
              }

              func note(_ s: String) {
                  let f = DateFormatter(); f.dateFormat = "HH:mm:ss"
                  let line = "\(f.string(from: Date())) \(s)"
                  DispatchQueue.main.async {
                      self.appLog.append(line)
                      if self.appLog.count > 300 { self.appLog.removeFirst(self.appLog.count - 300) }
                  }
              }

              func say(_ text: String, seconds: Double = 4) {
                  DispatchQueue.main.async {
                      self.toastWork?.cancel()
                      self.toast = text
                      let w = DispatchWorkItem { [weak self] in self?.toast = nil }
                      self.toastWork = w
                      DispatchQueue.main.asyncAfter(deadline: .now() + seconds, execute: w)
                  }
                  note("toast: \(text)")
              }

              // MARK: loading

              func load(_ toy: Toy, completion: ((Bool) -> Void)? = nil) {
                  unload()
                  DispatchQueue.main.async { self.loading = true; self.toy = toy; self.stopped = nil; self.frames.put(nil) }
                  DispatchQueue.global(qos: .userInitiated).async {
                      let ok = self.boot(toy)
                      DispatchQueue.main.async {
                          self.loading = false
                          completion?(ok)
                      }
                  }
              }

              private func boot(_ toy: Toy) -> Bool {
                  guard let rom = try? Data(contentsOf: ToyStore.romURL(toy.id)) else {
                      say("Couldn't read this toy's ROM file.")
                      return false
                  }
                  let snap = try? Data(contentsOf: ToyStore.snapURL(toy.id))
                  let flash = try? Data(contentsOf: ToyStore.flashURL(toy.id))
                  let meta = (try? String(contentsOf: ToyStore.flashMetaURL(toy.id), encoding: .utf8)) ?? ""
                  var elapsed = 0.0
                  let empty = Data()
                  let h: OpaquePointer? = rom.withUnsafeBytes { r in
                      (snap ?? empty).withUnsafeBytes { s in
                          (flash ?? empty).withUnsafeBytes { f in
                              meta.withCString { m in
                                  tg_create(r.bindMemory(to: UInt8.self).baseAddress, r.count,
                                            s.bindMemory(to: UInt8.self).baseAddress, s.count,
                                            f.bindMemory(to: UInt8.self).baseAddress, f.count,
                                            meta.isEmpty ? nil : m, rtcNow(), &elapsed)
                              }
                          }
                      }
                  }
                  guard let h else {
                      say("This toy couldn't start. Open Settings › Console and run \"diag\".", seconds: 8)
                      note("tg_create returned null for \(toy.id)")
                      return false
                  }
                  lock.lock()
                  handle = h
                  currentID = toy.id
                  lastCode = 0
                  lock.unlock()
                  applySettings()
                  for (k, v) in Prefs.coreParams { _ = withCore { h in k.withCString { tg_set_param(h, $0, v) } } }
                  let status = coreText { tg_status($0, $1, $2) } ?? ""
                  note("booted \(toy.id): \(status.split(separator: "\n").first ?? "")")
                  if elapsed > 60 { say("Welcome back! Your toy's clock moved ahead \(describeDuration(elapsed)).") }
                  DispatchQueue.main.async {
                      for line in Prefs.autorun { _ = Console.shared.run(line, emu: self) }
                  }
                  startThread()
                  return true
              }

              func unload() {
                  stopThread()
                  lock.lock()
                  if let h = handle {
                      saveLocked(h, snapshot: true)
                      tg_destroy(h)
                      handle = nil
                  }
                  lock.unlock()
              }

              func reload() {
                  if let t = toy { load(t) }
              }

              func applySettings() {
                  audio.muted = !Prefs.flag("soundOn")
                  audio.minFill = Prefs.num("p.audio_min_ms") / 1000
                  audio.maxFill = max(audio.minFill + 0.02, Prefs.num("p.audio_max_ms") / 1000)
                  audio.backgroundMode = Prefs.flag("liveInBackground")
                  let vol = Prefs.num("volume"), never = Prefs.flag("neverSleep")
                  withCore { h in
                      tg_set_volume(h, vol)
                      tg_set_never_sleep(h, never ? 1 : 0)
                  }
              }

              // MARK: the run loop

              private func startThread() {
                  stopFlag = false
                  paused = false
                  audio.start()
                  let t = Thread { [weak self] in self?.loop() }
                  t.name = "TamaiOS emulator"
                  t.qualityOfService = .userInteractive
                  thread = t
                  t.start()
              }

              private func stopThread() {
                  stopFlag = true
                  wake.signal()
                  while let t = thread, t.isExecuting { Thread.sleep(forTimeInterval: 0.005) }
                  thread = nil
              }

              /// Settings the loop reads, refreshed once a second instead of every tick.
              private struct LoopPrefs {
                  var tick = 0.004, sleepTick = 0.02, gap = 2.0, autosave = 180.0, fps = 60.0
                  static func read() -> LoopPrefs {
                      LoopPrefs(tick: max(1, Prefs.num("p.tick_ms")) / 1000,
                                sleepTick: max(1, Prefs.num("p.sleep_tick_ms")) / 1000,
                                gap: max(0.5, Prefs.num("p.gap_s")),
                                autosave: max(30, Prefs.num("p.autosave_s")),
                                fps: max(5, Prefs.num("p.fps")))
                  }
              }

              private func loop() {
                  var last = CACurrentMediaTime()
                  var lp = LoopPrefs.read()
                  var nextPrefs = last + 1
                  var nextAutosave = last + lp.autosave
                  var nextWall = last
                  var lastInput = last
                  var nextClockFix = last + 8          // give the toy a moment after loading
                  let audioBuf = UnsafeMutablePointer<Int16>.allocate(capacity: 44100)
                  defer { audioBuf.deallocate() }
                  var pixels = [UInt32](repeating: 0, count: 128 * 128)
                  var needFrame = true
                  var lastPublish = 0.0
                  var asleep = false
                  var nextRadio = last
                  var radioReady = false
                  while !stopFlag {
                      if paused || (holdForApp && radioReady && !linkBusy) {
                          _ = wake.wait(timeout: .now() + (paused ? 0.1 : 0.03))
                          last = CACurrentMediaTime()
                          continue
                      }
                      let now = CACurrentMediaTime()
                      if now >= nextPrefs { lp = LoopPrefs.read(); nextPrefs = now + 1 }
                      var dt = now - last
                      last = now
                      inputLock.lock()
                      let inputs = inputQ
                      inputQ.removeAll(keepingCapacity: true)
                      inputLock.unlock()
                      let wallNow: Double? = now >= nextWall ? rtcNow() : nil
                      if wallNow != nil { nextWall = now + 1 }

                      var code: Int32 = 0, flags: UInt32 = 0, n = 0, isDark = false, published = false
                      lock.lock()
                      guard let h = handle else { lock.unlock(); break }
                      for (key, down, wall) in inputs {
                          if down { tg_press(h, key, wall) } else { tg_release(h, key) }
                      }
                      if let w = wallNow { tg_set_wall_clock(h, w) }
                      if !inputs.isEmpty { lastInput = now }
                      // Keep the toy on iPhone time even when it never sleeps: if it is more
                      // than a minute off, re-set it while nobody is pressing buttons.
                      if let w = wallNow, now >= nextClockFix, now - lastInput > 15, !radioReady, tg_is_asleep(h) == 0,
                         abs(tg_clock_drift(h)) > 60 {
                          nextClockFix = now + 120
                          let off = tg_clock_drift(h)
                          if tg_sync_clock(h, w) == 1 {
                              note("clock set to iPhone time automatically (was off by \(Int(off)) s)")
                              say("Clock matched to your iPhone. 🕒")
                          }
                      }
                      if dt > lp.gap {
                          // iOS paused the app: move the toy's clock on like the real one
                          tg_advance_clock(h, dt)
                          note("gap of \(String(format: "%.1f", dt)) s, clock advanced")
                          dt = 0
                      }
                      let t0 = CACurrentMediaTime()
                      code = tg_tick(h, dt)
                      stats.lastTickMs = (CACurrentMediaTime() - t0) * 1000
                      stats.ticks += 1
                      flags = tg_take_flags(h)
                      n = tg_take_audio(h, audioBuf, 44100)
                      asleep = tg_is_asleep(h) != 0
                      var radioChanged = false
                      if now >= nextRadio {
                          nextRadio = now + 0.25
                          let r = tg_radio_ready(h) != 0
                          if r != radioReady { radioReady = r; radioChanged = true }
                      }
                      if flags & 1 != 0 { needFrame = true }
                      if needFrame && visible && now - lastPublish >= 1.0 / lp.fps {
                          isDark = pixels.withUnsafeMutableBufferPointer { tg_frame(h, $0.baseAddress) } != 0
                          needFrame = false
                          published = true
                          lastPublish = now
                      }
                      if flags & 4 != 0, let toy = toyID {
                          // it just went to sleep and saved itself, like the real toy
                          tg_flash_save(h, ToyStore.flashURL(toy).path)
                      }
                      if now >= nextAutosave {
                          nextAutosave = now + lp.autosave
                          saveLocked(h, snapshot: true)
                      }
                      lock.unlock()

                      audio.push(audioBuf, n)
                      if published { publish(pixels, dark: isDark) }
                      if radioChanged {
                          let r = radioReady
                          note(r ? "toy is waiting for the app" : "toy stopped waiting for the app")
                          DispatchQueue.main.async { self.appWaiting = r }
                      }
                      if flags & 2 != 0 { careCall() }
                      if flags & 16 != 0 {
                          note("clock synced to iPhone time")
                          if !syncAnnounced { syncAnnounced = true; say("Your toy's clock now matches your iPhone. 🕒") }
                      }
                      if code != 0 && code != lastCode { report(code) }
                      lastCode = code
                      // a button press wakes the loop at once; otherwise run at the tick
                      // rate (slower while the toy sleeps, to save battery)
                      _ = wake.wait(timeout: .now() + (asleep && !needFrame ? lp.sleepTick : lp.tick))
                  }
              }

              private var toyID: String? { currentID }

              private func publish(_ px: [UInt32], dark: Bool) {
                  let data = px.withUnsafeBufferPointer { Data(buffer: $0) }
                  guard let prov = CGDataProvider(data: data as CFData),
                        let img = CGImage(width: 128, height: 128, bitsPerComponent: 8, bitsPerPixel: 32, bytesPerRow: 512,
                                          space: CGColorSpaceCreateDeviceRGB(),
                                          bitmapInfo: CGBitmapInfo(rawValue: CGImageAlphaInfo.noneSkipFirst.rawValue | CGBitmapInfo.byteOrder32Little.rawValue),
                                          provider: prov, decode: nil, shouldInterpolate: false, intent: .defaultIntent)
                  else { return }
                  stats.frames += 1
                  frames.put(img)
                  if dark != lastDark {
                      lastDark = dark
                      DispatchQueue.main.async { self.dark = dark }
                  }
              }

              private func report(_ code: Int32) {
                  switch code {
                  case 1:
                      say("Bluetooth features (the phone app, downloads, camera) aren't available in the emulator. Your toy was put back to just before.", seconds: 7)
                  case 2:
                      say("Infrared features (playdates, gifts, marriage) aren't available in the emulator. Your toy was put back to just before.", seconds: 7)
                  case 3:
                      say("The game froze waiting for Bluetooth, so the toy was restarted (like swapping the batteries). Choose CONTINUE to carry on.", seconds: 8)
                  default:
                      note("core stopped with code \(code)")
                      DispatchQueue.main.async { self.stopped = StopInfo(code: code) }
                  }
              }

              private func careCall() {
                  note("care call heard")
                  DispatchQueue.main.async {
                      self.calling = true
                      DispatchQueue.main.asyncAfter(deadline: .now() + 2) { self.calling = false }
                      let active = UIApplication.shared.applicationState == .active
                      if !active && Prefs.flag("callAlerts") && Date().timeIntervalSince(self.lastCall) > Prefs.num("p.call_gap_s") {
                          self.lastCall = Date()
                          Notifier.postCall(name: self.toy?.name ?? "Your pet")
                      }
                  }
              }

              // MARK: input

              /// Button presses never wait for the emulator: they're queued and the
              /// emulator thread is woken to handle them straight away.
              func press(_ k: TGKey) { queue(k, down: true) }
              func release(_ k: TGKey) { queue(k, down: false) }

              private func queue(_ k: TGKey, down: Bool) {
                  inputLock.lock()
                  inputQ.append((k.rawValue, down, CACurrentMediaTime()))
                  inputLock.unlock()
                  wake.signal()
              }

              // MARK: saving

              private func saveLocked(_ h: OpaquePointer, snapshot: Bool) {
                  guard let id = toyID else { return }
                  if snapshot {
                      var p: UnsafeMutablePointer<UInt8>? = nil
                      var n = 0
                      if tg_snapshot(h, &p, &n) == 1, let p {
                          let d = Data(bytes: p, count: n)
                          tg_free(p, n)
                          do { try d.write(to: ToyStore.snapURL(id), options: .atomic) } catch { note("autosave failed: \(error)") }
                      }
                  }
                  if tg_is_asleep(h) != 0 { tg_flash_save(h, ToyStore.flashURL(id).path) }
              }

              func saveNow() {
                  withCore { saveLocked($0, snapshot: true) }
              }

              /// Make a backup file of the whole toy state to share.
              func backupFile() -> URL? {
                  guard let toy else { return nil }
                  var url: URL?
                  withCore { h in
                      var p: UnsafeMutablePointer<UInt8>? = nil
                      var n = 0
                      if tg_snapshot(h, &p, &n) == 1, let p {
                          let d = Data(bytes: p, count: n)
                          tg_free(p, n)
                          let f = DateFormatter(); f.dateFormat = "yyyy-MM-dd-HHmm"
                          let safe = toy.name.replacingOccurrences(of: "/", with: "-")
                          let u = FileManager.default.temporaryDirectory.appendingPathComponent("\(safe) \(f.string(from: Date())).tamaios")
                          try? d.write(to: u, options: .atomic)
                          url = u
                      }
                  }
                  return url
              }

              /// Restore a backup (.tamaios); false if it doesn't fit this toy's ROM.
              func restoreBackup(_ data: Data) -> Bool {
                  guard let toy, let rom = try? Data(contentsOf: ToyStore.romURL(toy.id)) else { return false }
                  let ok = rom.withUnsafeBytes { r in data.withUnsafeBytes { s in
                      tg_check_snapshot(r.bindMemory(to: UInt8.self).baseAddress, r.count, s.bindMemory(to: UInt8.self).baseAddress, s.count)
                  } } == 1
                  guard ok else { return false }
                  stopThread()
                  lock.lock()
                  if let h = handle { tg_destroy(h); handle = nil }
                  lock.unlock()
                  let snap = ToyStore.snapURL(toy.id)
                  try? FileManager.default.removeItem(at: snap.appendingPathExtension("bak"))
                  try? FileManager.default.copyItem(at: snap, to: snap.appendingPathExtension("bak"))
                  try? data.write(to: snap, options: .atomic)
                  // the flash save is older than the backup's own state: set it aside
                  for u in [ToyStore.flashURL(toy.id), ToyStore.flashMetaURL(toy.id)] {
                      try? FileManager.default.removeItem(at: u.appendingPathExtension("bak"))
                      try? FileManager.default.moveItem(at: u, to: u.appendingPathExtension("bak"))
                  }
                  load(toy)
                  return true
              }

              // MARK: toy actions

              /// Set the toy to iPhone time now. Returns whether it worked.
              @discardableResult
              func syncClock() -> Bool {
                  let now = rtcNow()
                  let ok = withCore { tg_sync_clock($0, now) } ?? 0
                  say(ok == 1 ? "Clock set to your iPhone's time. 🕒" : "The toy can't take a new time right now (maybe it's calling, or still in setup). TamaiOS will keep trying by itself.")
                  return ok == 1
              }

              func sleepNow() {
                  let ok = withCore { tg_force_sleep($0) } ?? 0
                  say(ok == 1 ? "Your toy is asleep. Press any button to wake it." : "It can't go to sleep right now.")
                  saveNow()
              }

              func restart() {
                  withCore { tg_restart($0) }
                  DispatchQueue.main.async { self.stopped = nil }
                  say("Restarted, like taking the batteries out. Your pet is kept.")
              }

              // MARK: app lifecycle

              func enterBackground() {
                  visible = false
                  backgroundAt = Date()
                  guard handle != nil else { return }
                  if Prefs.flag("liveInBackground") {
                      // keep living (the audio session keeps us running); save in case iOS ends us
                      saveNow()
                      note("background: staying alive")
                  } else {
                      paused = true
                      withCore { h in
                          tg_force_sleep(h)
                          saveLocked(h, snapshot: true)
                      }
                      audio.stop()
                      note("background: asleep and saved")
                  }
              }

              func enterForeground() {
                  visible = true
                  guard handle != nil else { return }
                  if paused {
                      let away = backgroundAt.map { Date().timeIntervalSince($0) } ?? 0
                      if away > 30 {
                          withCore { tg_advance_clock($0, away) }
                          say("Welcome back! Your toy's clock moved ahead \(describeDuration(away)).")
                      } else {
                          withCore { tg_wake($0) }
                      }
                      paused = false
                  }
                  audio.start()
                  DispatchQueue.main.async { self.forceRedraw() }
              }

              func forceRedraw() {
                  var px = [UInt32](repeating: 0, count: 128 * 128)
                  let d = withCore { h in px.withUnsafeMutableBufferPointer { tg_frame(h, $0.baseAddress) } }
                  if let d { publish(px, dark: d != 0) }
              }

              func willTerminate() {
                  withCore { saveLocked($0, snapshot: true) }
              }

              // MARK: text from the core

              func coreText(_ f: (OpaquePointer, UnsafeMutablePointer<UnsafeMutablePointer<UInt8>?>, UnsafeMutablePointer<Int>) -> Void) -> String? {
                  withCore { h in
                      var p: UnsafeMutablePointer<UInt8>? = nil
                      var n = 0
                      f(h, &p, &n)
                      guard let p else { return "" }
                      let s = String(decoding: UnsafeBufferPointer(start: p, count: n), as: UTF8.self)
                      tg_free(p, n)
                      return s
                  }
              }

              var isLoaded: Bool { lock.lock(); defer { lock.unlock() }; return handle != nil }
          }

          enum Notifier {
              static func ask(_ done: ((Bool) -> Void)? = nil) {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { ok, _ in
                      DispatchQueue.main.async { done?(ok) }
                  }
              }

              static func postCall(name: String) {
                  let c = UNMutableNotificationContent()
                  c.title = "\(name) is calling!"
                  c.body = "Your pet needs you. Tap to see what it wants."
                  c.sound = .default
                  let r = UNNotificationRequest(identifier: "call-\(Date().timeIntervalSince1970)", content: c, trigger: nil)
                  UNUserNotificationCenter.current().add(r)
              }
          }
