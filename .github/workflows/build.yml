              pts += bez((x + w, y + h*0.58), (x + w, y + h*0.86), (x + w*0.82, y + h), (cx, y + h))
              pts += bez((cx, y + h), (x + w*0.18, y + h), (x, y + h*0.86), (x, y + h*0.58))
              pts += bez((x, y + h*0.58), (x, y + h*0.25), (x + w*0.14, y), (cx, y))
