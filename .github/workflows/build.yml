              // MARK: actions

              private func setPending(_ p: Town.Pending, _ s: Suitor?, babySex: Int = 2, genes: Int = 0) {
                  guard let t = toy else { return }
                  var x = town.state(t)
                  x.pending = p
                  x.suitor = s
                  x.babySex = babySex
                  x.genes = genes
                  town.save(x, t)
                  if emu.appWaiting && p != .none { doPending() }
              }

              private func propose(_ s: Suitor, babySex: Int, genes: Int) {
                  chosen = nil
                  setPending(.marry, s, babySex: babySex, genes: genes)
              }

              private func maybeAuto() {
                  guard !autoTried, !busy, emu.appWaiting, let t = toy, case .ready = town.pack else { return }
                  let x = town.state(t)
                  if x.away && x.pending != .none { autoTried = true; doPending() }
              }

              private func run(_ work: @escaping (TamaLink, @escaping (String) -> Void) throws -> Void, done: @escaping (Error?) -> Void) {
                  busy = true
                  progress = "Connecting…"
                  let link = TamaLink(emu: emu)
                  DispatchQueue.global(qos: .userInitiated).async {
                      var err: Error?
                      do { try work(link) { m in DispatchQueue.main.async { progress = m } } } catch { err = error }
                      DispatchQueue.main.async { busy = false; done(err) }
                  }
              }

              private func doVisit() {
                  guard let t = toy else { return }
                  var data: [UInt8] = []
                  run({ link, p in data = try link.visit(progress: p) }) { err in
                      if let err {
                          emu.note("visit failed: \(err.localizedDescription)")
                          alert = ("Your Tama didn't come", "On the toy choose Connection › App › Visit, then try again.\n\n\(err.localizedDescription)")
                          return
                      }
                      try? Data(data).write(to: town.visitURL(t), options: .atomic)
                      var x = town.state(t)
                      x.away = true
                      x.pending = .none
                      town.save(x, t)
                      town.shuffle()
                      emu.note("visit ok: \(data.count) bytes")
                      emu.saveNow()
                  }
              }

              private func doPending() {
                  guard !busy, let t = toy else { return }
                  let x = town.state(t)
                  switch x.pending {
                  case .none: return
                  case .back:
                      run({ link, p in try link.back(progress: p) }) { err in
                          if let err { alert = ("Not home yet", err.localizedDescription); return }
                          var y = town.state(t); y.away = false; y.pending = .none; y.suitor = nil
                          town.save(y, t); emu.saveNow()
                          alert = ("Welcome home! 🏠", "\(tamaName) is back home.")
                      }
                  case .marry:
                      guard let s = x.suitor, let pkt = town.marriagePacket(t, s, babySex: x.babySex, genes: x.genes) else {
                          alert = ("Couldn't plan the wedding", "Bring your Tama to town again (Connection › App › Visit) and try once more.")
                          return
                      }
                      run({ link, p in try link.marry(pkt, progress: p) }) { err in
                          if let err {
                              emu.note("marriage failed: \(err.localizedDescription)")
                              alert = ("The wedding didn't finish", "Choose GO BACK › YES on the toy again — TamaiOS will retry.\n\n\(err.localizedDescription)")
                              return
                          }
                          var y = town.state(t)
                          let f = DateFormatter(); f.dateStyle = .medium
                          y.married.append("\(f.string(from: Date())): \(tamaName) married \(s.name) 💍")
                          y.away = false; y.pending = .none; y.suitor = nil
                          town.save(y, t)
                          emu.note("married \(s.name) b\(s.body) m\(s.face) a\(s.head) k\(s.back)")
                          emu.saveNow()
                          alert = ("Just married! 💍🎉", "\(tamaName) and \(s.name) are married! \(tamaName) is coming home with an egg — watch the toy.")
                      }
                  }
              }
          }

