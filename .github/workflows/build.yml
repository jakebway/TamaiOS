                    saveNow()
                    note("background: finishing transfer before applying pause setting")
                    pauseAfterTransferIfNeeded()
                    return
                }
                if Prefs.flag("liveInBackground") {
                    // keep living (the audio session keeps us running); save in case iOS ends us
                    saveNow()
                    note("background: staying alive")
                } else {
                    paused = true
                    withCore { h in
                        tg_force_sleep(h)
                        saveLocked(h, snapshot: true)
                    }
                    audio.stop()
                    note("background: asleep and saved")
                }
            }

            private func pauseAfterTransferIfNeeded() {
                DispatchQueue.main.asyncAfter(deadline: .now() + 0.25) {
                    guard !self.visible else { return }
                    if TransferGate.isBusy || self.linkBusy { self.pauseAfterTransferIfNeeded(); return }
                    guard !Prefs.flag("liveInBackground") else { return }
                    self.paused = true
                    self.withCore { h in
                        tg_force_sleep(h)
                        self.saveLocked(h, snapshot: true)
                    }
