            /// Prepare, validate, charge once, and persist the purchase before transmission.
            private func deliver(name: String, kind: String, cost: Int = 0, packet: @escaping (Int) async throws -> [UInt8]) {
                guard !sending, !link.busy, let toy = emu.toy else { return }
                picked = nil
                if town.bag(toy).contains(where: { $0.needsReview && $0.name == name && $0.kind == kind }) {
                    result = (false, "An earlier purchase of this item needs review. Use its Review button instead of buying it again.")
                    return
                }
                let charge = max(0, cost)
                sending = true
                progress = "Preparing your purchase…"
                Task {
                    var charged = false
                    var savedItem: Town.BagItem?
                    defer { sending = false }
                    do {
                        let pkt = try await packet(0)
                        try TransferPacket.validate(pkt)
                        guard emu.toy?.id == toy.id else { throw TamaLink.LinkError.notRunning }
                        wallet.refresh(emu)
                        guard let balance = wallet.balance, balance >= charge else {
                            throw TransferProtocolError.malformed("not enough Gotchi Points")
                        }
                        guard charge == 0 || wallet.adjust(-charge, emu: emu, deviceID: toy.id) else {
                            throw TransferProtocolError.malformed("couldn't update the profile balance")
                        }
                        charged = charge > 0
                        let item = try town.addToBag(toy, name: name, kind: kind, packet: pkt, price: charge)
                        savedItem = item
                        emu.note("purchase queued id=\(item.id) name=\(name) cost=\(charge) " + TransferPacket.summary(pkt))
                        guard live && emu.appWaiting && (UIApplication.shared.applicationState == .active || Prefs.flag("liveInBackground")) else {
                            result = (true, "Purchased and saved for pickup. Choose Connection › App › Download on the device.")
                            return
                        }
                        try await transmitPurchasedItem(item, toy: toy, packet: pkt)
                    } catch {
                        if charged && savedItem == nil {
                            if !wallet.adjust(charge, emu: emu, deviceID: toy.id) {
                                emu.note("purchase refund could not be applied; check balance")
                            }
                        }
                        emu.note("purchase / download not confirmed: " + error.localizedDescription)
                        result = (false, error.localizedDescription + (savedItem != nil ? " Your paid purchase is retained in the pickup bag. Use Review; do not buy it again." : ""))
                    }
                }
            }

            private func transmitPurchasedItem(_ item: Town.BagItem, toy: Toy, packet: [UInt8]) async throws {
                try TransferPacket.validate(packet)
                let transport = TamaLink(emu: emu)
                try town.markBagAttempt(item, toy: toy, attempted: true, note: "Transfer started; check the device before retrying.")
                link.openForDownload = false
                link.busy = true
                progress = "Sending \(item.name)…"
                defer { link.busy = false }
                do {
                    try await Task.detached(priority: .userInitiated) { try transport.finishItem(packet) }.value
                    try town.completeBagItem(item, toy: toy)
                    wallet.refresh(emu)
                    emu.saveNow()
                    emu.note("download transport complete id=\(item.id) name=\(item.name); check device inventory")
                    link.closeWith = "Transfer completed for \(item.name). Check the device’s gift screen or inventory."
                } catch {
                    try? town.markBagAttempt(item, toy: toy, attempted: transport.transmissionStarted, note: error.localizedDescription)
                    throw error
                }
            }

            private func retryPurchasedItem(_ item: Town.BagItem, toy: Toy) {
                guard !sending, !link.busy, let data = town.bagData(toy, item), let pkt = Town.userItemPacket(data, points: 0) else { return }
                do {
                    try TransferPacket.validate(pkt)
                    try town.markBagAttempt(item, toy: toy, attempted: false, note: "Retry authorized; no additional purchase charge.")
                } catch { result = (false, error.localizedDescription); return }
                guard live && emu.appWaiting && (UIApplication.shared.applicationState == .active || Prefs.flag("liveInBackground")) else {
                    result = (true, "The same paid purchase is queued again. Connect with Download; you will not be charged again.")
                    return
                }
                sending = true
                Task {
                    defer { sending = false }
                    do { try await transmitPurchasedItem(item, toy: toy, packet: pkt) }
                    catch { result = (false, error.localizedDescription + " Your purchase remains in the pickup bag.") }
                }
            }

            private func send(_ it: Entry) {
                guard !sending else { return }
                let cost = max(0, it.price ?? 0)
                wallet.refresh(emu)
                guard let balance = wallet.balance, balance >= cost else {
                    result = (false, "Not enough Gotchi Points. This item costs \(cost) G.")
                    return
                }
                emu.note("catalog selection id=\(it.id) name=\(it.name) kind=\(it.kind) cost=\(cost)")
                switch it.source {
                case .web(let w):
                    deliver(name: it.name, kind: it.kind, cost: cost) { pts in try await WebMeets.itemPacket(w, points: pts) }
                case .pack(let p):
                    deliver(name: it.name, kind: it.kind, cost: cost) { pts in
                        guard let pk = Town.shared.itemPacket(p, points: pts) else { throw URLError(.cannotDecodeContentData) }
                        return pk
                    }
                }
            }

            private func sendCustom(_ d: Data, name: String) {
                deliver(name: name, kind: "stations") { pts in
                    guard let pk = Town.userItemPacket(d, points: pts) else { throw URLError(.cannotDecodeContentData) }
                    return pk
                }
            }
        }
