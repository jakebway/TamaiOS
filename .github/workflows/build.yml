    - name: Bundle Fairy, Magic, and Wonder Garden
      run: |
        set -euo pipefail
        python3 - <<'BUNDLE_FIRMWARE'
        from pathlib import Path
        import shutil
        names = [
            "fw_tg18_en_v057_2019-05-13_fairy.bin",
            "fw_tg18_en_v058_2019-05-13_magic.bin",
            "fw_tg18_en_v063_2020-02-13_wondergarden.bin",
        ]
        destination = Path("ios/TamaiOS/BundledFirmware")
        if destination.exists(): shutil.rmtree(destination)
        destination.mkdir(parents=True)
        for name in names:
            source = Path("firmware") / name
            if not source.is_file() or source.stat().st_size != 8388608:
                raise SystemExit(f"Missing or invalid firmware: {source}; expected exactly 8388608 bytes")
            shutil.copyfile(source, destination / name)
            print(f"Bundled {name}")
        legacy = Path("ios/TamaiOS/Firmware.bin")
        if legacy.exists(): legacy.unlink()
        BUNDLE_FIRMWARE
    - name: Run transfer and purchase regression tests
      run: |
        set -euo pipefail
        mkdir -p ios
        xcrun swiftc -swift-version 5 \
          ios/TamaiOS/Tamatown/TransferProtocol.swift \
          tools/transfer-tests/main.swift \
          -o "$RUNNER_TEMP/tamaios-transfer-tests" 2>&1 | tee ios/transfer-tests.log
        "$RUNNER_TEMP/tamaios-transfer-tests" 2>&1 | tee -a ios/transfer-tests.log
    - name: Get the emulator core (tg18-emu by oreo-fox, MIT licence) + Bluetooth patch
      run: |
        git clone https://github.com/oreo-fox/tg18-emu upstream
        git -C upstream checkout 41204c92e98a8882d5c90a9876d8990f3b63e285
        # TamaiOS addition: the Bluetooth module, so the built-in Tama App works
        git -C upstream apply ../patches/radio.patch
    - name: Build the emulator core for iPhone
      run: |
        rustup target add aarch64-apple-ios
        cd ffi
        IPHONEOS_DEPLOYMENT_TARGET=16.0 cargo build --release --target aarch64-apple-ios
        mkdir -p ../ios/lib
        cp target/aarch64-apple-ios/release/libtamaios.a ../ios/lib/
        ls -la ../ios/lib
    - name: Draw the app icon
      run: |
        python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
        python3 tools/icon.py ios/TamaiOS/Assets.xcassets/AppIcon.appiconset/icon.png
        python3 tools/town.py ios/TamaiOS/TownBackground.png 1680
    - name: Make the Xcode project
      run: |
        brew install xcodegen
        cd ios && xcodegen generate
    - name: Validate generated Swift syntax
      run: |
        set -euo pipefail
        xcrun --sdk iphoneos swiftc -frontend -parse -target arm64-apple-ios16.0 \
          -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
          $(find ios/TamaiOS -name '*.swift' -print) 2>&1 | tee ios/swift-syntax.log
    - name: Build the app
      run: |
        set -euo pipefail
        cd ios
        xcodebuild -project TamaiOS.xcodeproj -scheme TamaiOS -configuration Release \
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
          CURRENT_PROJECT_VERSION=${{ github.run_number }} build 2>&1 | tee build.log
        test -d build/Build/Products/Release-iphoneos/TamaiOS.app
    - name: Package the IPA
      run: |
        set -euo pipefail
        cd ios
        test -d build/Build/Products/Release-iphoneos/TamaiOS.app
        rm -rf Payload
        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/TamaiOS.app Payload/
        zip -qry TamaiOS.ipa Payload
        test -s TamaiOS.ipa
        unzip -t TamaiOS.ipa
        ls -lh TamaiOS.ipa
    - name: Verify all firmware inside the IPA
      run: |
        set -euo pipefail
        python3 - <<'VERIFY_FIRMWARE'
        from pathlib import Path
        import hashlib
        import zipfile
        names = [
            "fw_tg18_en_v057_2019-05-13_fairy.bin",
            "fw_tg18_en_v058_2019-05-13_magic.bin",
            "fw_tg18_en_v063_2020-02-13_wondergarden.bin",
        ]
        with zipfile.ZipFile("ios/TamaiOS.ipa") as ipa:
            for name in names:
                bundled = ipa.read(f"Payload/TamaiOS.app/BundledFirmware/{name}")
                original = (Path("firmware") / name).read_bytes()
                if len(bundled) != 8388608 or hashlib.sha256(bundled).digest() != hashlib.sha256(original).digest():
                    raise SystemExit(f"Firmware verification failed: {name}")
                print(f"Verified in IPA: {name}")
        VERIFY_FIRMWARE
    - name: Upload the IPA
      uses: actions/upload-artifact@v4
      with:
        name: TamaiOS-ipa
        path: ios/TamaiOS.ipa
        if-no-files-found: error
    - name: Upload build diagnostics on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: TamaiOS-build-diagnostics
        path: |-
          ios/build.log
          ios/swift-syntax.log
          ios/transfer-tests.log
        if-no-files-found: ignore
