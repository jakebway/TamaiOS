push_back(self.pushed);\n+    }\n+\n+    /// Bytes up to the end of the next queued message.\n+    fn to_end(&mut self) -> usize {\n+        while let Some(&e) = self.ends.front() {\n+            if e <= self.popped {\n+                self.ends.pop_front();\n+            } else {\n+                return e - self.popped;\n+            }\n+        }\n+        self.queue.len()\n+    }\n+\n+    fn pop(&mut self) -> u8 {\n+        match self.queue.pop_front() {\n+            Some(b) => {\n+                self.popped += 1;\n+                b\n+            }\n+            None => 0,\n+        }\n+    }\n+\n+    pub fn select(&mut self, sel: bool) {\n+        if sel == self.selected {\n+            return;\n+        }\n+        self.selected = sel;\n+        if !sel {\n+            if self.tr.len() > 1 && self.tr[0] & 0xE0 == 0xA0 {\n+                if self.msg.len() > 4096 {\n+                    self.msg.clear();\n+                }\n+                let body = self.tr[1..].to_vec();\n+                self.msg.extend_from_slice(&body);\n+                let need = match (self.msg.first(), self.msg.get(1)) {\n+                    (Some(0x55), Some(&n)) => 8 + n as usize * 4,\n+                    (Some(0x22), Some(&n)) => 2 + n as usize,\n+                    _ => self.msg.len(),\n+                };\n+                if self.msg.len() >= need {\n+                    let m = std::mem::take(&mut self.msg);\n+                    self.message(&m[..need.max(1).min(m.len())]);\n+                }\n+            }\n+            self.tr.clear();\n+            self.answering = 0;\n+            self.fetch = 0;\n+        }\n+    }\n+\n+    /// One byte over SPI; returns the byte clocked back.\n+    pub fn xfer(&mut self, b: u8) -> u8 {\n+        self.tr.push(b);\n+        if self.fetch > 0 {\n+            self.fetch -= 1;\n+            return self.pop();\n+        }\n+        if self.tr.len() == 1 {\n+            if b == 0xAC {\n+                self.ac_count = self.ac_count.sat