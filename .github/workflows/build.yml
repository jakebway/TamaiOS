        /// a packet goes as F0 8D, 20-byte writes 15 ms apart, F0 CD. The toy answers
        /// F0 0C <received u16> (0x0200 = finished); the app then asks for data with
        /// F0 8E 0D and gets F0 0D <len u16>, the data, F0 4D.
        final class TamaLink {
            enum LinkError: LocalizedError {
                case notRunning, noAnswer, writeFailed
                var errorDescription: String? {
                    switch self {
                    case .notRunning: return "No device is running."
                    case .noAnswer: return "Your Tama didn't answer. On the device, choose Connection › App › Download, then try again."
                    case .writeFailed: return "Couldn't send to your Tama. Try again."
                    }
                }
            }

            let emu: Emulator
            /// The device's answer to the last hello (it carries its mode and the Tama's name).
            var hello: [UInt8] = []
            private(set) var transmissionStarted = false
            init(emu: Emulator) { self.emu = emu }

            var ready: Bool { (emu.withCore { tg_radio_ready($0) } ?? 0) != 0 }

            func connect(_ on: Bool) {
                if on { emu.linkBusy = true }
                emu.withCore { tg_radio_connect($0, on ? 1 : 0) }
                if !on { emu.radioStale = true; emu.holdLatch = false; emu.linkBusy = false }
            }

            private func write(_ d: [UInt8]) throws {
                // The emulated module takes the next chunk as soon as the device has read
                // the last one, so no artificial Bluetooth delays are needed.
                for _ in 0..<4000 {
                    try TransferGate.checkCancellation()
                    guard let r = emu.withCore({ h in d.withUnsafeBufferPointer { tg_radio_write(h, $0.baseAddress, $0.count) } }) else {
                        throw LinkError.notRunning
                    }
                    if r == 1 { return }
                    Thread.sleep(forTimeInterval: 0.001)
                }
                throw LinkError.writeFailed
            }

            private func read() -> [UInt8]? {
                emu.withCore { h -> [UInt8]? in
                    var p: UnsafeMutablePointer<UInt8>? = nil
                    var n = 0
                    guard tg_radio_read(h, &p, &n) == 1, let p else { return nil }
                    let a = Array(UnsafeBufferPointer(start: p, count: n))
                    tg_free(p, n)
                    return a
                } ?? nil
            }

            /// Throw away anything the toy sent that nobody asked for.
            func drain(_ seconds: Double) {
                let end = Date().addingTimeInterval(seconds)
                while Date() < end {
                    if read() == nil { Thread.sleep(forTimeInterval: 0.002) }
                }
            }

            /// Respect the 20-byte / 15 ms cadence used by the physical app protocol.
            func send(_ pkt: [UInt8]) throws {
                try TransferPacket.validate(pkt)
                emu.note("transfer TX " + TransferPacket.summary(pkt))
                Thread.sleep(forTimeInterval: 0.02)
                try write([0xF0, 0x8D])
                transmissionStarted = true
                var i = 0
                while i < pkt.count {
                    let j = min(i + 20, pkt.count)
                    try write(Array(pkt[i..<j]))
                    i = j
                    Thread.sleep(forTimeInterval: 0.015)
                }
                try write([0xF0, 0xCD])
            }

            /// No acknowledgement-only timeout is ever promoted to success.
            func answer(firstTimeout: Double = 4, idleTimeout: Double = 4,
                        requiresPayload: Bool = false, requiresFinalAck: Bool = false) throws -> [UInt8] {
                var reply = TransferReply(requiresPayload: requiresPayload, requiresFinalAck: requiresFinalAck)
                let started = ProcessInfo.processInfo.systemUptime
                var last = started
                var received = false
                while true {
                    try TransferGate.checkCancellation()
                    if ProcessInfo.processInfo.systemUptime - started > 45 {
                        emu.note("transfer absolute deadline " + reply.summary)
                        throw TransferProtocolError.incomplete(reply.summary)
                    }
                    if let frame = read() {
                        received = true
                        last = ProcessInfo.processInfo.systemUptime
                        let preview = frame.prefix(20).map { String(format: "%02X", $0) }.joined(separator: " ")
                        emu.note("transfer RX bytes=\(frame.count) head=\(preview)")
                        let paddingBefore = reply.transportPadding.count
                        let event: TransferReply.Event
                        do { event = try reply.consume(frame) }
                        catch {
                            emu.note("transfer parse failure " + reply.summary)
                            throw error
                        }
                        if reply.transportPadding.count > paddingBefore {
                            emu.note("accepted zero-filled final-chunk padding " + reply.summary)
                        }
                        switch event {
                        case .requestData: try write([0xF0, 0x8E, 0x0D])
                        case .completed:
                            emu.note("transfer response complete " + reply.summary)
                            return reply.payload
                        case .waiting: break
                        }
                    } else {
                        let now = ProcessInfo.processInfo.systemUptime
                        if (!received && now - started > firstTimeout) ||
                           (received && now - last > idleTimeout) || now - started > 45 {
                            emu.note("transfer timeout " + reply.summary)
                            throw TransferProtocolError.incomplete(reply.summary)
                        }
                        Thread.sleep(forTimeInterval: 0.002)
                    }
                }
            }

        }

        extension TamaLink {
            static func packet(op: UInt8, cmd: UInt8) -> [UInt8] {
                var p: UnsafeMutablePointer<UInt8>? = nil
                var n = 0
                tg_mm_packet(op, cmd, &p, &n)
                guard let p else { return [] }
                let a = Array(UnsafeBufferPointer(start: p, count: n))
                tg_free(p, n)
                return a
            }

            /// Hello (op, cmd 0), then the op's own packet; returns what the toy sends back.
            private func exchange(op: UInt8, then second: [UInt8]?, progress: (String) -> Void, firstTimeout: Double = 4) throws -> [UInt8] {
                guard emu.isLoaded else { throw LinkError.notRunning }
                try TransferGate.acquire()
                let background = TransferBackground(emu: emu)
                defer { TransferGate.release(); background.end() }
                drain(0.05)
                connect(true)
                defer {
                    drain(0.05)
                    connect(false)
                }
                progress("Saying hello…")
                try send(TamaLink.packet(op: op, cmd: 0))
                _ = try answer(firstTimeout: firstTimeout, requiresPayload: true)
                drain(0.05)
                guard let second else { return [] }
                try send(second)
                Thread.sleep(forTimeInterval: 0.05)
                return try answer(firstTimeout: 8, idleTimeout: 4)
            }

            /// Come home carrying a souvenir and points (GO BACK? › YES on the toy).
            func back(packet: [UInt8], progress: (String) -> Void) throws {
                progress("Walking your Tama home…")
                _ = try exchange(op: 0x15, then: packet, progress: progress)
            }

            /// The wedding (GO BACK? › YES on the toy): the toy comes home married.
            func marry(_ packet: [UInt8], progress: (String) -> Void) throws {
                progress("The wedding is starting… 💍")
                _ = try exchange(op: 0x16, then: packet, progress: progress)
            }
        }

        /// One app session, like the phone app: as soon as the toy connects TamaiOS
        /// says hello and learns which menu the toy is in (Visit, Download, or coming
        /// back), then does the right thing by itself.
        extension TamaLink {
            static let modeVisit: UInt8 = 0x14, modeBack: UInt8 = 0x15, modeDownload: UInt8 = 0x17

            /// Connect and say hello. Returns the toy's mode; stays connected.
            func probe() throws -> UInt8 {
                guard emu.isLoaded else { throw LinkError.notRunning }
                try TransferGate.acquire()
                let background = TransferBackground(emu: emu)
                defer { TransferGate.release(); background.end() }
                drain(0.05)
                connect(true)
                do {
                    try send(TamaLink.packet(op: 0x17, cmd: 0))
                    let a = try answer(requiresPayload: true)
                    drain(0.05)
                    guard a.count > 0x4C else { throw LinkError.noAnswer }
                    hello = a
                    emu.linkBusy = false      // stay connected; the toy waits (held) until we continue
                    return a[0x4C]
                } catch {
                    close()
                    throw error
                }
            }

            /// After probe() in Visit mode: the toy comes to town. Returns its visit data.
            func finishVisit() throws -> [UInt8] {
                try TransferGate.acquire()
                let background = TransferBackground(emu: emu)
                defer { close(); TransferGate.release(); background.end() }
                emu.linkBusy = true
                try send(TamaLink.packet(op: 0x14, cmd: 0x34))
                Thread.sleep(forTimeInterval: 0.05)
                let d = try answer(firstTimeout: 8, idleTimeout: 4, requiresPayload: true)
                guard d.count >= 512 else { throw LinkError.noAnswer }
                return d
            }

            /// A positive transport-finished acknowledgement is required for Download.
            func finishItem(_ pkt: [UInt8]) throws {
                transmissionStarted = false
                try TransferPacket.validate(pkt)
                guard pkt[0x4C] == 0x17, pkt[0x5E] == 0x3A else {
                    throw TransferProtocolError.malformed("not an item / points Download packet")
                }
                try TransferGate.acquire()
                let background = TransferBackground(emu: emu)
                defer { close(); TransferGate.release(); background.end() }
                guard emu.isLoaded, ready else { throw TransferProtocolError.notReady }
                emu.linkBusy = true
                drain(0.1)
                guard ready else { throw TransferProtocolError.notReady }
                try send(pkt)
                _ = try answer(firstTimeout: 8, idleTimeout: 5, requiresFinalAck: true)
                // Let the firmware process the terminal acknowledgement before disconnecting.
                drain(0.25)
                emu.note("download transport confirmed; inventory acceptance not independently verified")
            }

            func cancelDownload() throws {
                try TransferGate.acquire()
                let background = TransferBackground(emu: emu)
                defer { close(); TransferGate.release(); background.end() }
                guard ready else { return }
                emu.linkBusy = true
                try send(TamaLink.packet(op: 0x15, cmd: 0x36))
                _ = try? answer(firstTimeout: 2, idleTimeout: 2)
            }

            func close() {
                emu.linkBusy = true
                drain(0.05)
                connect(false)
                // Allow the guest to leave Download before a new connection is offered.
                let deadline = ProcessInfo.processInfo.systemUptime + 1.5
                while ready && ProcessInfo.processInfo.systemUptime < deadline {
                    Thread.sleep(forTimeInterval: 0.01)
                }
            }

        }

