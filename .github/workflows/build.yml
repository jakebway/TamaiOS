          /// The Arcade: a quick game that wins Gotchi Points for TamaDepa.
          /// "Tama Pop": Tamas pop out of the bushes — tap them before they hide.
          struct ArcadeView: View {
              @ObservedObject var town = Town.shared
              @AppStorage("gotchiWallet") private var wallet = 1000
              @AppStorage("arcadeBest") private var best = 0
              @AppStorage("haptics") private var haptics = true

              @State private var playing = false
              @State private var timeLeft: Double = 0
              @State private var score = 0
              @State private var holes: [Suitor?] = Array(repeating: nil, count: 9)
              @State private var shownAt: [Double] = Array(repeating: 0, count: 9)
              @State private var won: Int?
              @State private var clock: Double = 0

              private let length: Double = 30
              private let timer = Timer.publish(every: 0.1, on: .main, in: .common).autoconnect()

              var body: some View {
                  ScrollView {
                      VStack(spacing: 16) {
                          HStack {
                              stat("Time", playing ? "\(Int(timeLeft.rounded(.up)))" : "–")
                              stat("Caught", "\(score)")
                              stat("Wallet", "\(wallet) G")
                          }
                          ZStack {
                              RoundedRectangle(cornerRadius: 24, style: .continuous)
                                  .fill(LinearGradient(colors: [Color(red: 0.75, green: 0.92, blue: 1), Color(red: 0.62, green: 0.86, blue: 0.56)], startPoint: .top, endPoint: .bottom))
                              LazyVGrid(columns: Array(repeating: GridItem(.flexible(), spacing: 10), count: 3), spacing: 10) {
                                  ForEach(0..<9, id: \.self) { i in hole(i) }
                              }
                              .padding(14)
                              if !playing {
                                  VStack(spacing: 12) {
                                      Text(won.map { "You caught \($0 / 50)! +\($0) G 🎉" } ?? "Tama Pop")
                                          .font(.system(.title2, design: .rounded).weight(.heavy))
                                      Text("Tap the Tamas as they pop up. Each one is worth 50 Gotchi Points.")
                                          .font(.system(.subheadline, design: .rounded)).multilineTextAlignment(.center).foregroundStyle(.secondary)
                                      Button { start() } label: {
                                          Label(won == nil ? "Play" : "Play again", systemImage: "play.fill")
                                              .font(.system(.title3, design: .rounded).weight(.bold))
                                              .padding(.horizontal, 26).padding(.vertical, 10)
                                      }
                                      .buttonStyle(.borderedProminent).tint(.purple)
                                      if best > 0 { Text("Best: \(best)").font(.caption).foregroundStyle(.secondary) }
                                  }
                                  .padding(22)
                                  .background(RoundedRectangle(cornerRadius: 22, style: .continuous).fill(.regularMaterial))
                                  .padding(24)
                              }
                          }
                          .aspectRatio(1, contentMode: .fit)
                          Text("Spend your Gotchi Points at TamaDepa — they're sent along with your next gift.")
                              .font(.caption).foregroundStyle(.secondary).multilineTextAlignment(.center)
                      }
                      .padding(16)
                  }
