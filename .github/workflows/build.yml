        // --- Tama Town: marriage (see mm.rs) ------------------------------------------------

        static TOWN: std::sync::Mutex<Option<mm::Library>> = std::sync::Mutex::new(None);

        fn zip_entries(d: &[u8]) -> Vec<(String, Vec<u8>)> {
            let mut out = Vec::new();
            if d.len() < 22 {
                return out;
            }
            let start = d.len().saturating_sub(22 + 65535);
            let eocd = match (start..=d.len() - 22).rev().find(|&i| d[i..i + 4] == [0x50, 0x4B, 0x05, 0x06]) {
                Some(e) => e,
                None => return out,
            };
            let (count, mut off) = match (u16le(d, eocd + 10), u32le(d, eocd + 16)) {
                (Some(c), Some(o)) => (c, o),
                _ => return out,
            };
            for _ in 0..count {
                let ok = (|| -> Option<()> {
                    if d.get(off..off + 4)? != [0x50, 0x4B, 0x01, 0x02] {
                        return None;
                    }
                    let method = u16le(d, off + 10)?;
                    let csize = u32le(d, off + 20)?;
                    let nlen = u16le(d, off + 28)?;
                    let xlen = u16le(d, off + 30)?;
        TAMAIOS_SOURCE_EOF
    - name: Write ffi/src/lib.rs (3/3)
      run: |
        set -euo pipefail
        mkdir -p "ffi/src"
        cat >> 'ffi/src/lib.rs' <<'TAMAIOS_SOURCE_EOF'
                    let clen = u16le(d, off + 32)?;
                    let local = u32le(d, off + 42)?;
                    let name = String::from_utf8_lossy(d.get(off + 46..off + 46 + nlen)?).to_string();
                    off += 46 + nlen + xlen + clen;
                    let lnlen = u16le(d, local + 26)?;
                    let lxlen = u16le(d, local + 28)?;
                    let s = local + 30 + lnlen + lxlen;
                    let body = d.get(s..s + csize)?;
                    let data = match method {
                        0 => body.to_vec(),
                        8 => miniz_oxide::inflate::decompress_to_vec(body).ok()?,
                        _ => return Some(()),
                    };
                    out.push((name, data));
                    Some(())
                })();
                if ok.is_none() {
                    break;
                }
            }
            out
        }

        /// Load the MyMeets character pack (the zip as downloaded). Returns the number
        /// of usable characters (0 = nothing usable).
        #[no_mangle]
        pub extern "C" fn tg_mm_load_zip(p: *const u8, n: usize) -> i32 {
            let d = match unsafe { bytes(p, n) } {
                Some(d) => d,
                None => return 0,
            };
            catch_unwind(|| {
                let mut lib = mm::Library::default();
                for (name, data) in zip_entries(d) {
                    let low = name.to_ascii_lowercase().replace('\\', "/");
                    if low.contains("assets/characters/") {
                        lib.add_file(&name, data);
                    } else if low.contains("assets/items/") && low.ends_with(".txt") {
                        lib.add_item(&name, data);
                    }
                }
                lib.finish();
                let c = lib.ids.len() as i32;
                if c > 0 {
                    *TOWN.lock().unwrap() = Some(lib);
                }
                c
            })
            .unwrap_or(0)
        }

        /// Character ids (up to max) into out; returns how many.
        #[no_mangle]
        pub extern "C" fn tg_mm_ids(out: *mut u16, max: usize) -> usize {
            let g = TOWN.lock().unwrap();
            let ids = match g.as_ref() {
                Some(l) => &l.ids,
                None => return 0,
            };
            let n = ids.len().min(max);
            if !out.is_null() {
                unsafe { std::ptr::copy_nonoverlapping(ids.as_ptr(), out, n) };
            }
            n
        }

        /// Draw a character from parts (ids + palettes for B M A K) into out
        /// (64*64 0xAARRGGBB). Returns 1 on success.
        #[no_mangle]
        pub extern "C" fn tg_mm_compose(b: u16, bp: i32, m: u16, a: u16, ap: i32, k: u16, kp: i32, out: *mut u32) -> i32 {
            if out.is_null() {
                return 0;
            }
            let g = TOWN.lock().unwrap();
            let lib = match g.as_ref() {
                Some(l) => l,
                None => return 0,
            };
            let picks = [(b, bp.max(0) as usize), (m, 0), (a, ap.max(0) as usize), (k, kp.max(0) as usize)];
            match catch_unwind(AssertUnwindSafe(|| lib.compose(&picks, false))) {
                Ok(Some(img)) => {
                    let o = unsafe { std::slice::from_raw_parts_mut(out, 64 * 64) };
                    o.copy_from_slice(&img.px[..64 * 64]);
                    1
                }
                _ => 0,
            }
        }

        /// The 8 colours of a palette (for colour buttons).
        #[no_mangle]
        pub extern "C" fn tg_mm_palette(pal: i32, out: *mut u32) -> i32 {
            if out.is_null() {
                return 0;
            }
            let s = mm::palette_swatch(pal.max(0) as usize);
            unsafe { std::ptr::copy_nonoverlapping(s.as_ptr(), out, 8) };
            mm::PALETTE_COUNT as i32
        }

        /// A plain app packet (op 0x14 visit / 0x15 back / 0x16 marriage, cmd 0 = hello).
        #[no_mangle]
        pub extern "C" fn tg_mm_packet(op: u8, cmd: u8, out: *mut *mut u8, out_len: *mut usize) {
            give(mm::packet(op, cmd, 258, 0, None, None), out, out_len)
        }

        /// What the toy sent on a visit: bit0 adult, bit1 sex; name via tg_mm_visit_name.
        #[no_mangle]
        pub extern "C" fn tg_mm_visit_info(p: *const u8, n: usize) -> i32 {
            match unsafe { bytes(p, n) } {
                Some(v) => (mm::visit_is_adult(v) as i32) | ((mm::visit_sex(v) as i32 & 1) << 1),
                None => 0,
            }
        }

        #[no_mangle]
        pub extern "C" fn tg_mm_visit_name(p: *const u8, n: usize, out: *mut *mut u8, out_len: *mut usize) {
            let s = unsafe { bytes(p, n) }.map(mm::visit_name).unwrap_or_default();
            give_string(s, out, out_len)
        }

        /// The marriage packet. kind: 0 like the app, 1 the baby becomes the partner,
        /// 2 random genes. baby_sex 0/1. lang 4 JP / 8 EN. Returns 1 on success.
        #[no_mangle]
        pub extern "C" fn tg_mm_marriage(
            visit: *const u8, visit_len: usize,
            b: u16, bp: i32, m: u16, a: u16, ap: i32, k: u16, kp: i32,
            baby_sex: u8, lang: u8, kind: u8, name: *const c_char, seed: u64,
            out: *mut *mut u8, out_len: *mut usize,
        ) -> i32 {
            let v = unsafe { bytes(visit, visit_len) }.map(|x| x.to_vec()).unwrap_or_default();
            let name = unsafe { cstr(name) }.unwrap_or_default();
            let g = TOWN.lock().unwrap();
            let lib = match g.as_ref() {
                Some(l) => l,
                None => return 0,
            };
            let c = mm::Choice {
                picks: [(b, bp.max(0) as usize), (m, 0), (a, ap.max(0) as usize), (k, kp.max(0) as usize)],
                baby_sex,
                lang,
                kind,
                name,
            };
            match catch_unwind(AssertUnwindSafe(|| mm::marriage_packet(lib, &v, &c, seed))) {
                Ok(Some(p)) => {
                    give(p, out, out_len);
                    1
                }
                _ => 0,
            }
        }


        /// Shop items from the loaded pack as JSON: [{"i":0,"lang":"en","file":..,"id":..,"name":..,"kind":"food"}]
        #[no_mangle]
        pub extern "C" fn tg_mm_items(out: *mut *mut u8, out_len: *mut usize) {
            let g = TOWN.lock().unwrap();
            let v: Vec<serde_json::Value> = g
                .as_ref()
                .map(|l| {
                    l.items
                        .iter()
                        .enumerate()
                        .map(|(i, it)| serde_json::json!({"i": i, "lang": it.lang, "file": it.file, "id": it.id, "name": it.name, "kind": it.kind}))
                        .collect()
                })
                .unwrap_or_default();
            give_string(serde_json::Value::Array(v).to_string(), out, out_len)
        }

        /// Delivery packet for pack item i, with Gotchi Points. Returns 1 on success.
        #[no_mangle]
        pub extern "C" fn tg_mm_item_packet(i: usize, points: u32, out: *mut *mut u8, out_len: *mut usize) -> i32 {
            let g = TOWN.lock().unwrap();
            match g.as_ref().and_then(|l| l.items.get(i)) {
                Some(it) => {
                    give(mm::item_packet(&it.data, points), out, out_len);
                    1
                }
                None => 0,
            }
        }

        /// Delivery packet for an item file the user brought. Returns 1 on success.
        #[no_mangle]
        pub extern "C" fn tg_mm_user_item(p: *const u8, n: usize, points: u32, out: *mut *mut u8, out_len: *mut usize) -> i32 {
            match unsafe { bytes(p, n) }.and_then(|d| mm::wrap_user_item(d, points)) {
                Some(v) => {
                    give(v, out, out_len);
                    1
                }
                None => 0,
            }
        }

        /// Name of an item file the user brought ("" if it isn't one).
        #[no_mangle]
        pub extern "C" fn tg_mm_user_item_name(p: *const u8, n: usize, out: *mut *mut u8, out_len: *mut usize) {
            let name = unsafe { bytes(p, n) }
                .and_then(|d| {
                    if d.len() > 0x110 && d[0x4c] == 0x17 {
                        let l = u32::from_le_bytes([d[0x108], d[0x109], d[0x10a], d[0x10b]]) as usize;
                        d.get(0x10c..0x10c + l).and_then(mm::item_info)
                    } else {
                        mm::item_info(d)
                    }
                })
                .map(|(id, name)| if name.is_empty() { id } else { name })
                .unwrap_or_default();
            give_string(name, out, out_len)
        }

        /// Gotchi Points only (no item), like the app's point gifts.
        #[no_mangle]
        pub extern "C" fn tg_mm_points_packet(points: u32, out: *mut *mut u8, out_len: *mut usize) {
            give(mm::packet(0x17, 0x3A, 258, points, None, None), out, out_len)
        }

        /// Come-home packet carrying an optional item (raw item file or delivery packet) and points.
        #[no_mangle]
        pub extern "C" fn tg_mm_back_packet(p: *const u8, n: usize, points: u32, out: *mut *mut u8, out_len: *mut usize) {
            give(mm::back_packet(unsafe { bytes(p, n) }, points), out, out_len)
        }

        /// The Tamagotchi's own name from visit data.
        #[no_mangle]
        pub extern "C" fn tg_mm_tama_name(p: *const u8, n: usize, out: *mut *mut u8, out_len: *mut usize) {
            let s = unsafe { bytes(p, n) }.map(mm::visit_tama_name).unwrap_or_default();
            give_string(s, out, out_len)
        }
        // English TG18 Param layout; guarded by the exact known firmware fingerprints.
        fn profile_base(e: &Emu) -> Option<u32> {
            match tg18::code_hash(&e.image) {
                0xD780_5452_8833_EB90 | 0x8313_24F3_B2FA_6768 | 0xA38D_22B6_76C5_3108 => Some(0xF800_D864),
                _ => None,
            }
        }
        fn profile_points(e: &mut Emu) -> Option<u16> {
            let base = profile_base(e)?;
            if !(1..=4).contains(&e.m.sys.read8(base + 0x52)) { return None; }
            Some(u16::from_le_bytes([e.m.sys.read8(base + 0x20), e.m.sys.read8(base + 0x21)]))
        }
        #[no_mangle]
        pub extern "C" fn tg_profile_points(e: *mut Emu) -> i32 {
            if e.is_null() { return -1; }
            let em = unsafe { &mut *e };
            catch_unwind(AssertUnwindSafe(|| profile_points(em).map(i32::from).unwrap_or(-1))).unwrap_or(-1)
        }
        #[no_mangle]
        pub extern "C" fn tg_profile_adjust_points(e: *mut Emu, delta: i32) -> i32 {
            if e.is_null() { return -1; }
            let em = unsafe { &mut *e };
            catch_unwind(AssertUnwindSafe(|| {
                let Some(base) = profile_base(em) else { return -1; };
                let Some(current) = profile_points(em) else { return -1; };
                let next = i64::from(current) + i64::from(delta);
                if !(0..=65535).contains(&next) { return -1; }
                em.m.sys.poke(base + 0x20, &(next as u16).to_le_bytes());
                next as i32
            })).unwrap_or(-1)
        }
        #[no_mangle]
        pub extern "C" fn tg_profile_attention(e: *mut Emu) -> i32 {
            if e.is_null() { return -1; }
            let em = unsafe { &mut *e };
            catch_unwind(AssertUnwindSafe(|| {
                let Some(base) = profile_base(em) else { return -1; };
                if !(1..=4).contains(&em.m.sys.read8(base + 0x52)) { return 0; }
                (em.m.sys.read8(base + 0x0C) & 0x0F) as i32
            })).unwrap_or(-1)
        }

        #[cfg(test)]
        mod profile_bridge_tests {
            use super::*;
            #[test]
            fn no_device_is_not_a_zero_balance_or_care_call() {
                assert_eq!(tg_profile_points(std::ptr::null_mut()), -1);
                assert_eq!(tg_profile_adjust_points(std::ptr::null_mut(), 100), -1);
                assert_eq!(tg_profile_attention(std::ptr::null_mut()), -1);
            }
        }

        TAMAIOS_SOURCE_EOF
    - name: Write ffi/src/mm.rs (1/3)
      run: |
        set -euo pipefail
        mkdir -p "ffi/src"
        cat > 'ffi/src/mm.rs' <<'TAMAIOS_SOURCE_EOF'
        //! Marriage support for the built-in Tama App: character parts, pictures,
        //! character data and the app packets, as the official app (and the MyMeets
        //! community tool, whose behaviour this follows) produced them.
        //!
        //! Character parts come from the MyMeets character pack the user downloads
        //! (files `NNcIIII_Type_P[_en].txt`), never from this source.

        use std::collections::HashMap;

        // ---- packets --------------------------------------------------------------------

        pub const OP_VISIT: u8 = 0x14;
        pub const OP_BACK: u8 = 0x15;
        pub const OP_MARRIAGE: u8 = 0x16;
        pub const OP_ITEM: u8 = 0x17;
        pub const CMD_START: u8 = 0;
        pub const CMD_VISIT: u8 = 0x34;
        pub const CMD_BACK: u8 = 0x36;
        pub const CMD_MARRIAGE: u8 = 0x38;

        const CODE_TAMAGO: &[u8; 6] = b"TAMAGO";
        const CODE_SECURITY: [u8; 8] = [0x7c, 0x68, 0x48, 0x97, 0x75, 0xa6, 0x4e, 0x99];
        const CODE_FORMAT: [u8; 8] = [0, 0, 0, 0, 0x10, 0, 0x01, 0x04];
        pub const MARRIAGE_PACKET_SIZE: usize = 39334;

        struct W<'a> {
            b: &'a mut Vec<u8>,
            p: usize,
        }
        impl<'a> W<'a> {
            fn bytes(&mut self, d: &[u8]) {
                let end = (self.p + d.len()).min(self.b.len());
                let n = end - self.p.min(end);
                self.b[self.p..self.p + n].copy_from_slice(&d[..n]);
                self.p += d.len();
            }
            fn zeros(&mut self, n: usize) {
                self.p += n;
            }
            fn u8(&mut self, v: u8) {
                self.bytes(&[v])
            }
            fn u16(&mut self, v: u16) {
                self.bytes(&v.to_le_bytes())
            }
            fn u32(&mut self, v: u32) {
                self.bytes(&v.to_le_bytes())
            }
        }

        /// The partner as the marriage packet describes it.
        pub struct Partner {
            pub sex: u8,
            pub id: u16,
            pub name: Vec<u8>,
            pub generation: u16,
            pub growth: u8,
            pub twins: u8,
            pub birthday: u16,
            pub dna: u8,
            pub dna_pattern: [u8; 8],
            pub palette: [u8; 3],
            pub character_info: Vec<u8>,
            pub parent_images: Vec<u8>,
        }

        pub struct Marriage {
            pub partner: Partner,
            pub character_data: Vec<u8>,
            pub colors: [u8; 3],
            pub dna_pattern: [u8; 8],
            pub dna_value: u8,
            pub sex: u8,
        }

        /// Build a packet (BLETmgcPacket.Compile in MyMeets).
        pub fn packet(op: u8, cmd: u8, size: usize, gotchi_points: u32, item: Option<&[u8]>, marriage: Option<&Marriage>) -> Vec<u8> {
            let size = size.max(258);
            let mut raw = vec![0u8; size];
            {
                let mut w = W { b: &mut raw, p: 0 };
                w.bytes(CODE_TAMAGO);
                match marriage {
                    Some(m) => {
                        w.zeros(60);
                        w.bytes(&m.colors);
                        w.zeros(3);
                    }
                    None => w.zeros(66),
                }
                w.u32(size as u32);
                w.u8(op);
                w.u8(0);
                w.u32(0);
                w.bytes(&CODE_SECURITY);
                w.u32(0);
                w.u8(cmd);
                match marriage {
                    Some(m) => {
                        let v = &m.partner;
                        w.u8(v.sex);
                        let mut name = [0u8; 16];
                        let n = v.name.len().min(16);
                        name[..n].copy_from_slice(&v.name[..n]);
                        w.bytes(&name);
                        w.u16(0);
                        w.u16(0); // RandomID1
                        w.u16(v.id);
                        w.zeros(3);
                        w.u8(0);
                        w.u16(v.generation);
                        w.u8(v.growth);
                        w.zeros(6);
                        w.u8(v.twins);
                        w.u16(0); // Unknown1
                        w.u16(0); // Unknown2
                        w.u8(0); // BKind
                        w.u8(0); // PKind
                        w.u16(v.birthday);
                        w.u16(0);
                        w.u16(0); // RandomID2
                        w.zeros(8);
                        w.bytes(&v.dna_pattern);
                        w.u8(m.dna_value);
                        w.u8(m.sex);
                        w.bytes(&v.palette);
                        w.bytes(&m.dna_pattern);
                        w.u8(m.dna_value);
                        w.zeros(13);
                    }
                    None => w.zeros(92),
                }
                if gotchi_points > 0 {
                    w.u8(3);
                    w.u32(gotchi_points);
                } else {
                    w.zeros(5);
                }
                if marriage.is_some() {
                    w.zeros(12);
                    w.u32(256);
                    w.u32(33036);
                } else {
                    w.zeros(20);
                }
                if item.is_some() {
                    w.u32(256);
                    w.zeros(20);
                } else {
                    w.zeros(24);
                }
                if marriage.is_some() {
                    w.u32(33176);
                    w.zeros(8);
                } else {
                    w.zeros(12);
                }
                w.bytes(&CODE_FORMAT);
                if let Some(it) = item {
                    w.u32(2);
                    w.u32(1);
                    w.u32(it.len() as u32);
                    w.bytes(it);
                    w.u32(0);
                } else if let Some(m) = marriage {
                    w.u32(0);
                    w.u32(1);
                    w.u32(32768);
                    let mut cd = m.character_data.clone();
                    cd.resize(32768, 0);
                    w.bytes(&cd);
                    w.bytes(&m.partner.character_info);
                    w.bytes(&m.partner.parent_images);
                }
            }
            let n = raw.len();
            let sum = raw[..n - 2].iter().fold(0u16, |a, &b| a.wrapping_add(b as u16));
            // MyMeets sums the whole buffer before the checksum is written (it is still 0)
            raw[n - 2..].copy_from_slice(&sum.to_le_bytes());
            raw
        }

        // ---- strings --------------------------------------------------------------------

        const MOJIS: [&str; 16] = [
            "\u{3000}あいうえおかきくけこさしすせそ", "たちつてとなにぬねのはひふへほま", "みむめもやゆよらりるれろわをんぁ",
            "ぃぅぇぉっゃゅょがぎぐげござじず", "ぜぞだぢづでどばびぶべぼぱぴぷぺ", "ぽー～…、。()「」.・!?&○",
            "×┣◎★┳♪┫↑↓→←￥\u{3000}012", "3456789アイウエオカキクケ", "コサシスセソタチツテトナニヌネノ",
            "ハヒフヘホマミムメモヤユヨラリル", "レロワヲンァィゥェォッャュョガギ", "グゲゴザジズゼゾダヂヅデドバビブ",
            "ベボパピプペポヴ        ", "│┌┐┘└├┬┤┴┼━┃┏┓┛┗", "ABCDEFGHIJKLMNOP", "QRSTUVWXYZ%-+  \n",
        ];

        /// Encode a name the way the toy stores text (language byte + table index).
        pub fn encode_name(s: &str, lang: u8) -> Vec<u8> {
            let mut out = Vec::new();
            for c in s.to_uppercase().chars() {
                for (row, chars) in MOJIS.iter().enumerate() {
                    if let Some(col) = chars.chars().position(|x| x == c) {
                        out.push(lang);
                        out.push(((row as u8) << 4) | (col as u8 & 15));
                        break;
                    }
                }
            }
            out
        }

        pub fn decode_name(b: &[u8]) -> String {
            let mut s = String::new();
            for p in b.chunks(2) {
                if p.len() < 2 || (p[0] != 4 && p[0] != 8) {
                    break;
                }
                if let Some(c) = MOJIS[(p[1] >> 4) as usize].chars().nth((p[1] & 15) as usize) {
                    s.push(c);
                }
            }
            s.trim().to_string()
        }

        // ---- DNA ----------------------------------------------------------------------

        const DNA_PATTERNS: [[[u8; 8]; 4]; 4] = [
            [[0, 1, 10, 11, 8, 9, 2, 3], [8, 9, 2, 3, 0, 1, 10, 11], [0, 9, 10, 3, 8, 1, 2, 11], [8, 1, 2, 11, 0, 9, 10, 3]],
            [[0, 1, 10, 11, 12, 9, 6, 3], [8, 9, 2, 3, 4, 1, 14, 11], [0, 9, 10, 3, 12, 1, 6, 11], [8, 1, 2, 11, 4, 9, 14, 3]],
            [[0, 1, 10, 11, 12, 1, 2, 11], [8, 1, 2, 11, 4, 9, 10, 3], [0, 1, 10, 11, 8, 9, 6, 3], [8, 9, 2, 3, 4, 1, 14, 11]],
            [[0, 9, 10, 3, 8, 1, 6, 11], [8, 1, 2, 11, 0, 9, 14, 3], [0, 1, 10, 11, 8, 9, 6, 3], [8, 9, 2, 3, 0, 1, 14, 11]],
        ];
        const DNA_PATTERN_E: [[u8; 8]; 13] = [
            [0, 9, 10, 11, 12, 13, 14, 15], [8, 1, 10, 11, 12, 13, 14, 15], [0, 1, 10, 11, 12, 13, 14, 15],
            [8, 9, 10, 3, 12, 13, 14, 15], [0, 1, 10, 11, 12, 13, 14, 15], [0, 9, 2, 11, 12, 13, 14, 15],
            [0, 9, 10, 3, 12, 13, 14, 15], [8, 9, 2, 11, 12, 13, 14, 15], [8, 9, 2, 3, 12, 13, 14, 15],
            [0, 1, 2, 11, 12, 13, 14, 15], [0, 1, 10, 3, 12, 13, 14, 15], [0, 9, 2, 3, 12, 13, 14, 15], [8, 1, 2, 3, 12, 13, 14, 15],
        ];

        pub struct Rng(u64);
        impl Rng {
            pub fn new(seed: u64) -> Rng {
                Rng(seed ^ 0x9E37_79B9_7F4A_7C15 | 1)
            }
            pub fn next(&mut self, lo: i32, hi: i32) -> i32 {
                // xorshift64*; [lo, hi) like .NET Random.Next
                self.0 ^= self.0 >> 12;
                self.0 ^= self.0 << 25;
                self.0 ^= self.0 >> 27;
                let v = self.0.wrapping_mul(0x2545_F491_4F6C_DD1D);
                if hi <= lo {
                    return lo;
                }
                lo + (v % (hi - lo) as u64) as i32
            }
        }

        /// DNA pattern for the chosen marriage type: 0 = like the device/app,
        /// 1 = "get character" (the baby becomes the partner), 2 = random genes.
        pub fn dna_from_type(kind: u8, generation_hint: u8, rng: &mut Rng) -> (u8, [u8; 8]) {
            let mut p = [0u8; 8];
            match kind {
                0 => {
                    p = [8; 8];
                    (255, p)
                }
                1 => {
                    let v = if generation_hint > 1 && generation_hint - 1 <= 3 { generation_hint - 1 } else { 255 };
                    if v != 255 {
                        return (v, DNA_PATTERN_E[v as usize]);
                    }
                    let r = rng.next(0, 100);
                    let g = if r < 25 { 0 } else if r < 50 { 1 } else if r < 75 { 2 } else { 3 };
                    let k = if r % 10 > 3 { (r % 10 % 3 + 1) as usize } else { 0 };
                    p.copy_from_slice(&DNA_PATTERNS[g][k]);
                    (g as u8, p)
                }
                _ => {
                    for b in p.iter_mut() {
                        *b = rng.next(0, 12) as u8;
                    }
                    (255, p)
                }
            }
        }

        // ---- pictures -----------------------------------------------------------------------

        #[derive(Clone)]
        pub struct Image {
            pub w: usize,
            pub h: usize,
            /// 0xAARRGGBB
            pub px: Vec<u32>,
        }

        impl Image {
            pub fn new(w: usize, h: usize) -> Image {
                Image { w, h, px: vec![0; w * h] }
            }
            pub fn get(&self, x: usize, y: usize) -> u32 {
                self.px[y * self.w + x]
            }
            pub fn set(&mut self, x: usize, y: usize, c: u32) {
                if x < self.w && y < self.h {
                    self.px[y * self.w + x] = c;
                }
            }
        }

        fn rgb565_to_argb(v: u16) -> u32 {
            // stored with blue in the high bits (as the toy's images are)
            let b = ((v & 0xF800) >> 11) as u32 * 255 / 31;
            let g = ((v & 0x07E0) >> 5) as u32 * 255 / 63;
            let r = (v & 0x1F) as u32 * 255 / 31;
            0xFF00_0000 | r << 16 | g << 8 | b
        }

        fn argb_to_565(c: u32) -> u16 {
            let r = ((c >> 16) & 0xFF) as u16;
            let g = ((c >> 8) & 0xFF) as u16;
            let b = (c & 0xFF) as u16;
            ((b >> 3) & 31) << 11 | ((g >> 2) & 63) << 5 | ((r >> 3) & 31)
        }

        /// Size of one picture from its header (0 if it isn't one).
        pub fn image_size(h: &[u8]) -> usize {
            if h.len() < 6 {
                return 0;
            }
            let v = u16::from_le_bytes([h[3], h[4]]);
            if v != 1 && v != 256 {
                return 0;
            }
            let (w, ht, n) = (h[0] as usize, h[1] as usize, h[2] as usize);
            let mut px = w * ht;
            if n <= 16 {
                px /= 2;
            }
            6 + px + n * 2
        }

        /// Decode a toy picture; pixel (0,0)'s colour becomes transparent.
        pub fn decode_image(b: &[u8], key_transparent: bool) -> Option<Image> {
            let size = image_size(b);
            if size == 0 || size > b.len() {
                return None;
            }
            let (w, h, n) = (b[0] as usize, b[1] as usize, b[2] as usize);
            let pal: Vec<u32> = (0..n).map(|i| rgb565_to_argb(u16::from_be_bytes([b[6 + i * 2], b[7 + i * 2]]))).collect();
            let mut img = Image::new(w, h);
            let start = 6 + n * 2;
            if n <= 16 {
                for i in 0..w * h / 2 {
                    let v = b[start + i];
                    let (lo, hi) = ((v & 15) as usize, (v >> 4) as usize);
                    let (p0, p1) = (i * 2, i * 2 + 1);
                    img.px[p0] = *pal.get(lo).unwrap_or(&0);
                    if p1 < w * h {
                        img.px[p1] = *pal.get(hi).unwrap_or(&0);
                    }
                }
            } else {
                for i in 0..w * h {
                    img.px[i] = *pal.get(b[start + i] as usize).unwrap_or(&0);
                }
            }
            if key_transparent && !img.px.is_empty() {
                let k = img.px[0];
                for p in img.px.iter_mut() {
                    if *p == k {
                        *p = 0;
                    }
                }
            }
            Some(img)
        }

        /// Encode a picture in the toy's format (TamagoImage.FromBitmap).
        pub fn encode_image(img: &Image) -> Vec<u8> {
            let mut pal: Vec<u32> = Vec::new();
            for x in 0..img.w {
                for y in 0..img.h {
                    let c = img.get(x, y);
                    if !pal.contains(&c) {
                        pal.push(c);
                    }
                }
            }
            let n = pal.len().min(255);
            let mut size = img.w * img.h;
            if n <= 16 {
                size /= 2;
            }
            let mut total = 6 + size + n * 2;
            total += total % 4;
            let mut out = vec![0u8; total];
            out[0] = img.w as u8;
            out[1] = img.h as u8;
            out[2] = n as u8;
            let v: u16 = if n <= 16 { 1 } else { 256 };
            out[3..5].copy_from_slice(&v.to_le_bytes());
            out[5] = 0xFF;
            for (i, c) in pal.iter().take(n).enumerate() {
                let v = argb_to_565(*c);
                out[6 + i * 2..8 + i * 2].copy_from_slice(&v.to_be_bytes());
            }
            let start = 6 + n * 2;
            let idx = |c: u32| pal.iter().position(|&p| p == c).unwrap_or(0).min(255) as u8;
            if n <= 16 {
                let mut i = 0;
                while i + 1 < img.w * img.h + 1 && i < img.w * img.h {
                    let a = idx(img.px[i]) & 15;
                    let b = if i + 1 < img.px.len() { idx(img.px[i + 1]) & 15 } else { 0 };
                    out[start + i / 2] = a | b << 4;
                    i += 2;
                }
            } else {
                for (i, &c) in img.px.iter().enumerate() {
                    out[start + i] = idx(c);
                }
            }
            out
        }

        // ---- colour palettes (13 x 8, palette 0 = the parts' own colours) ---------------------

