        import Foundation
        import UIKit
        import UserNotifications
        import Combine

        /// Local care banners. No remote push service is needed.
        final class CareAlerts: ObservableObject {
            static let shared = CareAlerts()
            @Published private(set) var status = "Checking notification settings…"
            @Published private(set) var lastError: String?
            private let prefix = "tamaios-care-"
            private var sentMasks: [String: Int] = [:]
            private var inFlight: Set<String> = []
            private var lastAttempts: [String: Date] = [:]

            private var enabled: Bool { Prefs.flag("callAlerts") && Prefs.flag("liveInBackground") }

            func refresh() {
                UNUserNotificationCenter.current().getNotificationSettings { settings in
                    DispatchQueue.main.async {
                        switch settings.authorizationStatus {
                        case .notDetermined: self.status = "Permission not requested"
                        case .denied: self.status = "Notifications blocked in iPhone Settings"
                        case .provisional: self.status = "Quiet delivery only — enable alerts in iPhone Settings"
                        case .authorized, .ephemeral:
                            self.status = settings.alertSetting == .enabled && settings.alertStyle != .none
                                ? "Visual alerts allowed by iOS" : "Banners disabled in iPhone Settings"
                        @unknown default: self.status = "Check iPhone notification settings"
                        }
                    }
                }
            }

            func prepare() {
                refresh()
                guard enabled else { cancelAll(); return }
                UNUserNotificationCenter.current().getNotificationSettings { settings in
                    guard settings.authorizationStatus == .notDetermined else { return }
                    DispatchQueue.main.async {
                        guard UIApplication.shared.applicationState == .active else { return }
                        self.ask()
                    }
                }
            }

            func ask(_ done: ((Bool) -> Void)? = nil) {
                UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { granted, error in
                    DispatchQueue.main.async {
                        if let error { self.lastError = error.localizedDescription }
                        self.refresh()
                        done?(granted)
                    }
                }
            }

            func cancelAll() {
                let center = UNUserNotificationCenter.current()
                center.getPendingNotificationRequests { requests in
                    center.removePendingNotificationRequests(withIdentifiers: requests.map(\.identifier).filter { $0.hasPrefix(self.prefix) })
                }
                center.getDeliveredNotifications { notifications in
                    center.removeDeliveredNotifications(withIdentifiers: notifications.map { $0.request.identifier }.filter { $0.hasPrefix(self.prefix) })
                }
            }

            func observe(mask: Int, deviceID: String, name: String) {
                DispatchQueue.main.async {
                    if mask == 0 {
                        self.sentMasks[deviceID] = nil
                        self.lastAttempts[deviceID] = nil
                        let identifier = self.prefix + deviceID
                        let center = UNUserNotificationCenter.current()
                        center.removePendingNotificationRequests(withIdentifiers: [identifier])
                        center.removeDeliveredNotifications(withIdentifiers: [identifier])
                        return
                    }
                    guard mask > 0, self.enabled,
                          UIApplication.shared.applicationState == .background,
                          self.sentMasks[deviceID] != mask,
                          !self.inFlight.contains(deviceID) else { return }
                    if let last = self.lastAttempts[deviceID], Date().timeIntervalSince(last) < 15 { return }
                    self.lastAttempts[deviceID] = Date()
                    self.inFlight.insert(deviceID)
                    let center = UNUserNotificationCenter.current()
                    center.getNotificationSettings { settings in
                        DispatchQueue.main.async {
                            guard self.enabled, UIApplication.shared.applicationState == .background,
                                  AppModel.current?.emu.toy?.id == deviceID,
                                  settings.authorizationStatus == .authorized || settings.authorizationStatus == .ephemeral else {
                                self.inFlight.remove(deviceID)
                                self.refresh()
                                return
                            }
                            if let emu = AppModel.current?.emu {
                                let currentMask = emu.withCore { tg_profile_attention($0) } ?? -1
                                if currentMask == 0 {
                                    self.inFlight.remove(deviceID)
                                    return
                                }
                            }
                            let content = UNMutableNotificationContent()
                            content.title = "\(name) needs you!"
                            content.body = "Your Tama has a care call. Tap to check on it."
                            content.sound = .default
                            content.threadIdentifier = self.prefix + deviceID
                            content.categoryIdentifier = "TAMAIOS_CARE"
                            content.userInfo = ["deviceID": deviceID]
                            let trigger = UNTimeIntervalNotificationTrigger(timeInterval: 1, repeats: false)
                            let request = UNNotificationRequest(identifier: self.prefix + deviceID, content: content, trigger: trigger)
                            center.add(request) { error in
                                DispatchQueue.main.async {
                                    self.inFlight.remove(deviceID)
                                    if let error {
                                        self.lastError = error.localizedDescription
                                        AppModel.current?.emu.note("care notification failed: " + error.localizedDescription)
                                    } else {
                                        self.sentMasks[deviceID] = mask
                                        AppModel.current?.emu.note("care banner scheduled for " + deviceID)
                                        if !self.enabled || UIApplication.shared.applicationState != .background {
                                            center.removePendingNotificationRequests(withIdentifiers: [request.identifier])
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }

            func testBanner() {
                guard enabled else { lastError = "Enable Background Mode and Care Notifications first."; return }
                ask { granted in
                    guard granted else { self.lastError = "Allow notifications in iPhone Settings first."; return }
                    let content = UNMutableNotificationContent()
                    content.title = "TamaiOS Care Notifications"
                    content.body = "Test banner — care alerts are ready."
                    content.sound = .default
                    let request = UNNotificationRequest(identifier: self.prefix + "test", content: content,
                        trigger: UNTimeIntervalNotificationTrigger(timeInterval: 5, repeats: false))
                    UNUserNotificationCenter.current().add(request) { error in
                        DispatchQueue.main.async {
                            self.lastError = error?.localizedDescription
                            self.status = error == nil ? "Test scheduled: leave TamaiOS within 5 seconds" : "Test could not be scheduled"
                        }
                    }
                }
            }

            func openSettings() {
                guard let url = URL(string: UIApplication.openSettingsURLString) else { return }
                UIApplication.shared.open(url)
            }
        }

