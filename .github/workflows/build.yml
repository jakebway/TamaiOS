                  .navigationBarTitleDisplayMode(.inline)
                  .onReceive(timer) { _ in tick() }
                  .onDisappear { playing = false }
              }

              private func stat(_ t: String, _ v: String) -> some View {
                  VStack(spacing: 2) {
                      Text(t).font(.caption).foregroundStyle(.secondary)
                      Text(v).font(.system(.headline, design: .rounded)).monospacedDigit()
                  }
                  .frame(maxWidth: .infinity)
                  .padding(.vertical, 8)
                  .background(RoundedRectangle(cornerRadius: 14).fill(Color(.secondarySystemBackground)))
              }

              private func hole(_ i: Int) -> some View {
                  ZStack(alignment: .bottom) {
                      Ellipse().fill(Color(red: 0.36, green: 0.62, blue: 0.34)).frame(height: 26)
                      if let s = holes[i] {
                          Group {
                              if let img = town.image(s) {
                                  CharacterPicture(image: img)
                              } else {
                                  Text("🐣").font(.system(size: 44))
                              }
                          }
                          .frame(width: 70, height: 70)
                          .padding(.bottom, 8)
                          .transition(.move(edge: .bottom).combined(with: .opacity))
                      }
                  }
                  .frame(maxWidth: .infinity, minHeight: 96)
                  .contentShape(Rectangle())
                  .onTapGesture { tap(i) }
              }

              private func start() {
                  score = 0
                  won = nil
                  timeLeft = length
                  holes = Array(repeating: nil, count: 9)
                  playing = true
              }

              private func randomTama() -> Suitor {
                  town.randomSuitor(mix: false) ?? Suitor(name: "TAMA", body: 0, face: 0, head: 0, back: 0, bodyColor: 0, headColor: 0, backColor: 0, blurb: "")
              }

              private func tick() {
                  clock += 0.1
                  guard playing else { return }
                  timeLeft -= 0.1
                  if timeLeft <= 0 {
                      playing = false
                      withAnimation { holes = Array(repeating: nil, count: 9) }
                      let pts = score * 50
                      won = pts
                      wallet = min(99999, wallet + pts)
                      best = max(best, score)
                      return
                  }
                  // Tamas hide again after a moment; speed up as time runs out
                  let stay = 0.6 + 0.6 * (timeLeft / length)
                  for i in 0..<9 where holes[i] != nil && clock - shownAt[i] > stay {
                      withAnimation(.easeIn(duration: 0.12)) { holes[i] = nil }
                  }
                  let busy = holes.compactMap { $0 }.count
                  if busy < 3 && Double.random(in: 0...1) < 0.35 {
                      let free = (0..<9).filter { holes[$0] == nil }
                      if let i = free.randomElement() {
                          shownAt[i] = clock
                          withAnimation(.spring(response: 0.25, dampingFraction: 0.6)) { holes[i] = randomTama() }
                      }
                  }
              }

              private func tap(_ i: Int) {
                  guard playing, holes[i] != nil else { return }
                  score += 1
                  if haptics { Haptics.tap() }
                  withAnimation(.easeOut(duration: 0.1)) { holes[i] = nil }
              }
          }
