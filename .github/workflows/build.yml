          int32_t tg_poke(Emu *e, uint32_t addr, const uint8_t *data, size_t n);
          void tg_script_press(Emu *e, int32_t key, double delay);
          void tg_read_cstr(Emu *e, uint32_t addr, uint8_t **out, size_t *out_len);

