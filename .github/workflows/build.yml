            func download() {
                pack = .loading
                Task.detached(priority: .userInitiated) {
                    do {
                        var req = URLRequest(url: Town.packURL)
                        req.timeoutInterval = 120
                        let (d, r) = try await URLSession.shared.data(for: req)
                        guard (r as? HTTPURLResponse)?.statusCode == 200, d.count > 100_000 else { throw URLError(.badServerResponse) }
                        try d.write(to: Town.packFile, options: .atomic)
                        await MainActor.run { self.load(from: Town.packFile) }
                    } catch {
                        await MainActor.run { self.pack = .failed(error.localizedDescription) }
                    }
                }
            }

            func importPack(_ data: Data) {
