                      let fm = FileManager.default
                      var done: [String] = []
                      for u in [ToyStore.snapURL(t.id), ToyStore.flashURL(t.id), ToyStore.flashMetaURL(t.id)] {
                          let b = u.appendingPathExtension("bak")
