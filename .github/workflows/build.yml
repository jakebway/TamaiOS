    - name: Write ios/TamaiOS/Tamatown/TransferProtocol.swift
      run: |
        set -euo pipefail
        mkdir -p "ios/TamaiOS/Tamatown"
        cat > 'ios/TamaiOS/Tamatown/TransferProtocol.swift' <<'TAMAIOS_SOURCE_EOF'
        import Foundation

        /// Validates transport packets and parses complete, length-delimited replies.
        /// A transport acknowledgement is not proof of inventory installation.
        enum TransferProtocolError: LocalizedError {
            case malformed(String), incomplete(String), busy, notReady
            var errorDescription: String? {
                switch self {
                case .malformed(let why): return "Invalid download data: " + why
                case .incomplete(let why): return "Delivery unconfirmed: " + why + " Check the device before retrying."
                case .busy: return "Another device transfer is still finishing. Please wait."
                case .notReady: return "This Download connection has ended. Choose Connection › App › Download again."
                }
            }
        }

        enum TransferPacket {
            static func validate(_ bytes: [UInt8]) throws {
                guard (258...65535).contains(bytes.count), Array(bytes.prefix(6)) == Array("TAMAGO".utf8) else {
                    throw TransferProtocolError.malformed("missing TAMAGO header or unsupported packet size")
                }
                let declared = UInt32(bytes[0x48]) | UInt32(bytes[0x49]) << 8 | UInt32(bytes[0x4A]) << 16 | UInt32(bytes[0x4B]) << 24
                guard declared == UInt32(bytes.count) else { throw TransferProtocolError.malformed("packet length does not match its header") }
                let stored = UInt16(bytes[bytes.count - 2]) | UInt16(bytes[bytes.count - 1]) << 8
                let computed = bytes.dropLast(2).reduce(UInt16(0)) { $0 &+ UInt16($1) }
                guard stored == computed else { throw TransferProtocolError.malformed("packet checksum mismatch") }
            }
            static func summary(_ bytes: [UInt8]) -> String {
                guard bytes.count >= 0x5F else { return "bytes=\(bytes.count)" }
                var hash: UInt64 = 14695981039346656037
                for byte in bytes { hash = (hash ^ UInt64(byte)) &* 1099511628211 }
                return String(format: "bytes=%d op=%02X cmd=%02X hash=%016llX", bytes.count, Int(bytes[0x4C]), Int(bytes[0x5E]), hash)
            }
        }

        struct TransferReply {
            enum Event { case waiting, requestData, completed }
            let requiresPayload: Bool
            let requiresFinalAck: Bool
            private(set) var payload: [UInt8] = []
            private(set) var expected: Int?
            private(set) var finalAck = false
            private(set) var dataEnded = false
            private(set) var controlExtension: [UInt8] = []
            private(set) var transportPadding: [UInt8] = []
            private var requested = false

            init(requiresPayload: Bool = false, requiresFinalAck: Bool = false) {
                self.requiresPayload = requiresPayload
                self.requiresFinalAck = requiresFinalAck
            }
            var summary: String {
                "expected=\(expected.map(String.init) ?? "none") received=\(payload.count) finalAck=\(finalAck) dataEnded=\(dataEnded) extensionBytes=\(controlExtension.count) paddingBytes=\(transportPadding.count)"
            }
            mutating func consume(_ frame: [UInt8]) throws -> Event {
                guard !frame.isEmpty else { return .waiting }
                // While payload bytes remain, control-looking bytes are still payload.
                if let expected, payload.count < expected {
                    let remaining = expected - payload.count
                    if frame.count <= remaining {
                        payload += frame
                    } else {
                        // Wonder Garden sends a fixed 20-byte final data notification.
                        // Only its zero-filled bytes beyond the transport length are padding.
                        let padding = Array(frame.dropFirst(remaining))
                        guard frame.count == 20, padding.count < 20,
                              padding.allSatisfy({ $0 == 0 }) else {
                            throw TransferProtocolError.malformed("non-padding bytes exceed the declared reply length")
                        }
                        payload += frame.prefix(remaining)
                        transportPadding += padding
                    }
                    // The final data chunk alone never completes a transfer.
                    return .waiting
                }
                let tag: UInt16 = frame.count >= 2 ? UInt16(frame[0]) | UInt16(frame[1]) << 8 : 0
                switch tag {
                case 0x0CF0:
                    guard frame.count >= 4 else { throw TransferProtocolError.malformed("truncated acknowledgement") }
                    controlExtension = Array(frame.dropFirst(4))
                    let status = UInt16(frame[2]) | UInt16(frame[3]) << 8
                    if status == 0x0200 {
                        finalAck = true
                        if requiresPayload && (expected == nil || !dataEnded) {
                            throw TransferProtocolError.incomplete("finished acknowledgement arrived without a complete data response")
                        }
                        return .completed
                    }
                    if !requested { requested = true; return .requestData }
                    return .waiting
                case 0x0DF0:
                    guard frame.count >= 4, expected == nil else { throw TransferProtocolError.malformed("invalid or repeated reply header") }
                    controlExtension = Array(frame.dropFirst(4))
                    let size = Int(UInt16(frame[2]) | UInt16(frame[3]) << 8)
                    guard size <= 65535 else { throw TransferProtocolError.malformed("reply is too large") }
                    expected = size
                    payload.reserveCapacity(size)
                    return .waiting
                case 0x4DF0, 0x5CF0:
                    guard frame.count >= 2, let expected, payload.count == expected else {
                        throw TransferProtocolError.incomplete("reply ended without its declared payload")
                    }
                    controlExtension = Array(frame.dropFirst(2))
                    dataEnded = true
                    return requiresFinalAck ? .waiting : .completed
                default:
                    throw TransferProtocolError.malformed("unexpected response frame")
                }
            }
        }

        /// Process-wide gate: probe, item, marriage, return, and cancellation cannot overlap.
        enum TransferGate {
            private static let lock = NSLock()
            private static var held = false
            private static var cancelled = false
            static var isBusy: Bool { lock.lock(); defer { lock.unlock() }; return held }
            static func acquire() throws {
                lock.lock(); defer { lock.unlock() }
                guard !held else { throw TransferProtocolError.busy }
                held = true
                cancelled = false
            }
            static func cancel() { lock.lock(); if held { cancelled = true }; lock.unlock() }
            static func checkCancellation() throws {
                lock.lock(); let stopped = cancelled; lock.unlock()
                if stopped { throw TransferProtocolError.incomplete("iOS ended the background transfer window") }
            }
            static func release() { lock.lock(); held = false; lock.unlock() }
        }

        /// Backward-compatible persisted purchase. Retrying this record never creates a new charge.
        struct PendingPurchase: Codable, Identifiable, Equatable {
            var id = UUID()
            var name: String
            var kind: String
            var attempted: Bool? = nil
            var deliveryNote: String? = nil
            var purchasePrice: Int? = nil
            var attemptCount: Int? = nil
            var needsReview: Bool { attempted ?? false }
        }
        TAMAIOS_SOURCE_EOF
    - name: Write tools/transfer-tests/main.swift
      run: |
        set -euo pipefail
        mkdir -p "tools/transfer-tests"
        cat > 'tools/transfer-tests/main.swift' <<'TAMAIOS_SOURCE_EOF'
        import Foundation

        var checks = 0
        func expect(_ value: Bool, _ name: String) {
            checks += 1
            if !value { fatalError("FAILED: " + name) }
        }
        func mustThrow(_ name: String, _ body: () throws -> Void) {
            checks += 1
            do { try body(); fatalError("FAILED, expected error: " + name) } catch {}
        }
        func completed(_ event: TransferReply.Event) -> Bool { if case .completed = event { return true }; return false }
        func packet(_ size: Int = 258) -> [UInt8] {
            var bytes = [UInt8](repeating: 0, count: size)
            bytes.replaceSubrange(0..<6, with: "TAMAGO".utf8)
            for i in 0..<4 { bytes[0x48 + i] = UInt8((size >> (8 * i)) & 255) }
            bytes[0x4C] = 0x17; bytes[0x5E] = 0x3A
            let sum = bytes.dropLast(2).reduce(UInt16(0)) { $0 &+ UInt16($1) }
            bytes[size - 2] = UInt8(sum & 255); bytes[size - 1] = UInt8(sum >> 8)
            return bytes
        }

        do {
            try TransferPacket.validate(packet())
            checks += 1
            var corrupt = packet(); corrupt[100] ^= 1
            mustThrow("corrupt checksum") { try TransferPacket.validate(corrupt) }
            var badLength = packet(); badLength[0x48] = 0
            mustThrow("wrong declared size") { try TransferPacket.validate(badLength) }
            mustThrow("short packet") { try TransferPacket.validate([1, 2, 3]) }
            mustThrow("oversize packet") { try TransferPacket.validate(packet(65536)) }

            struct CapturedReply: Decodable {
                let ack: [UInt8]
                let header: [UInt8]
                let chunks: [[UInt8]]
                let expectedTransportLength: Int
                let expectedPaddingLength: Int
            }
            let fixtureURL = URL(fileURLWithPath: "tools/transfer-tests/wondergarden-build40.json")
            let fixture = try JSONDecoder().decode(CapturedReply.self, from: Data(contentsOf: fixtureURL))
            var capturedReply = TransferReply(requiresPayload: true)
            let capturedAck = try capturedReply.consume(fixture.ack)
            if case .requestData = capturedAck { checks += 1 } else { fatalError("captured ACK should request data") }
            expect(capturedReply.controlExtension == [6, 6, 6, 0], "preserve captured 8-byte ACK extension")
            _ = try capturedReply.consume(fixture.header)
            for chunk in fixture.chunks {
                expect(!completed(try capturedReply.consume(chunk)), "captured payload alone cannot complete the response")
            }
            expect(capturedReply.payload.count == fixture.expectedTransportLength, "captured transport payload is exactly 512 bytes")
            expect(capturedReply.transportPadding.count == fixture.expectedPaddingLength, "captured final notification has eight padding bytes")
            expect(capturedReply.transportPadding.allSatisfy { $0 == 0 }, "only zero transport padding is accepted")
            expect(Array(capturedReply.payload.prefix(6)) == Array("TAMAGO".utf8), "captured response preserves TAMAGO header")
            // Synthetic terminal-frame tests: these frames were NOT present in the truncated diagnostics.
            expect(completed(try capturedReply.consume([0xF0, 0x4D])), "explicit terminal frame completes captured prefix")

            var paddedDownload = TransferReply(requiresFinalAck: true)
            _ = try paddedDownload.consume(fixture.ack)
            _ = try paddedDownload.consume(fixture.header)
            for chunk in fixture.chunks { _ = try paddedDownload.consume(chunk) }
            expect(!completed(try paddedDownload.consume([0xF0, 0x4D, 6, 6, 6, 0])), "Download still waits for a terminal acknowledgement")
            expect(completed(try paddedDownload.consume([0xF0, 0x0C, 0, 2, 6, 6, 6, 0])), "extended terminal acknowledgement accepted")

            var corruptedTail = TransferReply()
            _ = try corruptedTail.consume([0xF0, 0x0D, 12, 0])
            var nonzeroTail = [UInt8](repeating: 0, count: 20)
            nonzeroTail[19] = 1
            mustThrow("nonzero bytes beyond transport size are not silently discarded") { _ = try corruptedTail.consume(nonzeroTail) }
            var extendedHeader = TransferReply(requiresPayload: true)
            _ = try extendedHeader.consume([0xF0, 0x0D, 2, 0, 6, 6, 6, 0])
            _ = try extendedHeader.consume([0xF0, 0x4D])
            expect(extendedHeader.payload == [0xF0, 0x4D], "control-looking payload bytes remain payload")
            expect(completed(try extendedHeader.consume([0xF0, 0x4D, 6, 6, 6, 0])), "extended terminator accepted after full payload")

            var ackOnly = TransferReply()
            expect(completed(try ackOnly.consume([0xF0, 0x0C, 0, 2])), "explicit finished acknowledgement")
            var progress = TransferReply()
            let progressEvent = try progress.consume([0xF0, 0x0C, 0x20, 0])
            expect(!completed(progressEvent), "progress acknowledgement is not success")
            if case .requestData = progressEvent { checks += 1 } else { fatalError("expected data request") }
            expect(!completed(try progress.consume([0xF0, 0x0C, 0x40, 0])), "duplicate progress is not success")

            var data = TransferReply(requiresPayload: true)
            _ = try data.consume([0xF0, 0x0C, 1, 0])
            _ = try data.consume([0xF0, 0x0D, 4, 0])
            _ = try data.consume([10, 20])
            _ = try data.consume([30, 40])
            expect(completed(try data.consume([0xF0, 0x4D])), "complete data and terminator")
            expect(data.payload == [10, 20, 30, 40], "payload reconstruction")

            var collision = TransferReply(requiresPayload: true)
            _ = try collision.consume([0xF0, 0x0D, 2, 0])
            expect(!completed(try collision.consume([0xF0, 0x4D])), "control-looking payload is data")
            expect(completed(try collision.consume([0xF0, 0x4D])), "real terminator after full payload")
            expect(collision.payload == [0xF0, 0x4D], "payload bytes preserved")

            var needsAck = TransferReply(requiresFinalAck: true)
            _ = try needsAck.consume([0xF0, 0x0D, 2, 0])
            _ = try needsAck.consume([1, 2])
            expect(!completed(try needsAck.consume([0xF0, 0x4D])), "data end alone does not confirm a Download")
            expect(completed(try needsAck.consume([0xF0, 0x0C, 0, 2])), "Download final acknowledgement")

            var noHeader = TransferReply()
            mustThrow("terminator without length") { _ = try noHeader.consume([0xF0, 0x4D]) }
            var shortAck = TransferReply()
            mustThrow("short ack") { _ = try shortAck.consume([0xF0, 0x0C, 0]) }
            var noData = TransferReply(requiresPayload: true)
            mustThrow("hello cannot be ack-only") { _ = try noData.consume([0xF0, 0x0C, 0, 2]) }
            var oversizedData = TransferReply()
            _ = try oversizedData.consume([0xF0, 0x0D, 1, 0])
            mustThrow("payload exceeds declared size") { _ = try oversizedData.consume([1, 2]) }
            var unknown = TransferReply()
            mustThrow("unexpected frame") { _ = try unknown.consume([0xAA, 0xBB]) }

            let oldJSON = "{\"id\":\"00000000-0000-0000-0000-000000000001\",\"name\":\"LIMOUSINE\",\"kind\":\"item\"}"
            let legacy = try JSONDecoder().decode(PendingPurchase.self, from: Data(oldJSON.utf8))
            expect(!legacy.needsReview, "old bag entries stay queued")
            var attempted = legacy
            attempted.attempted = true
            attempted.purchasePrice = 600
            attempted.attemptCount = 1
            let restored = try JSONDecoder().decode(PendingPurchase.self, from: JSONEncoder().encode(attempted))
            expect(restored.needsReview, "unconfirmed state survives restart")
            expect(restored.purchasePrice == 600 && restored.id == legacy.id, "purchase identity and price are preserved")
            var retry = restored
            retry.attempted = false
            expect(retry.id == restored.id && retry.purchasePrice == restored.purchasePrice, "retry reuses the same purchase")
            expect([restored, legacy].first(where: { !$0.needsReview })?.id == legacy.id, "automatic delivery skips uncertain attempts")

            try TransferGate.acquire()
            mustThrow("concurrent transfer blocked") { try TransferGate.acquire() }
            TransferGate.cancel()
            mustThrow("background cancellation stops a transfer") { try TransferGate.checkCancellation() }
            TransferGate.release()
            expect(!TransferGate.isBusy, "gate released")
            try TransferGate.acquire(); try TransferGate.checkCancellation(); TransferGate.release()
            checks += 1
            print("Passed \(checks) transfer regression checks")
        } catch { fatalError("Unexpected test error: \(error)") }
        TAMAIOS_SOURCE_EOF
    - name: Write ios/TamaiOS/Tamatown/TransferBackground.swift
      run: |
        set -euo pipefail
        mkdir -p "ios/TamaiOS/Tamatown"
        cat > 'ios/TamaiOS/Tamatown/TransferBackground.swift' <<'TAMAIOS_SOURCE_EOF'
        import Foundation
        import UIKit

        /// A finite iOS background-task allowance, used only to finish an in-flight transfer.
        final class TransferBackground {
            private var identifier: UIBackgroundTaskIdentifier = .invalid
            init(emu: Emulator) {
                let begin = {
                    self.identifier = UIApplication.shared.beginBackgroundTask(withName: "Complete TamaiOS transfer") { [weak self, weak emu] in
                        TransferGate.cancel()
                        emu?.note("background transfer allowance expired; delivery may be unconfirmed")
                        emu?.saveNow()
                        self?.end()
                    }
                }
                if Thread.isMainThread { begin() } else { DispatchQueue.main.sync(execute: begin) }
            }
            func end() {
                DispatchQueue.main.async {
                    guard self.identifier != .invalid else { return }
                    let value = self.identifier
                    self.identifier = .invalid
                    UIApplication.shared.endBackgroundTask(value)
                }
            }
        }
        TAMAIOS_SOURCE_EOF
