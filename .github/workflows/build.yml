          import SwiftUI

          /// Egg outline, rounder like the Tamagotchi ON's shell.
          struct EggShape: Shape {
              func path(in r: CGRect) -> Path {
                  let w = r.width, h = r.height
                  var p = Path()
                  p.move(to: CGPoint(x: r.midX, y: r.minY))
                  p.addCurve(to: CGPoint(x: r.maxX, y: r.minY + h * 0.58),
                             control1: CGPoint(x: r.minX + w * 0.90, y: r.minY),
                             control2: CGPoint(x: r.maxX, y: r.minY + h * 0.26))
                  p.addCurve(to: CGPoint(x: r.midX, y: r.maxY),
                             control1: CGPoint(x: r.maxX, y: r.minY + h * 0.88),
                             control2: CGPoint(x: r.minX + w * 0.80, y: r.maxY))
                  p.addCurve(to: CGPoint(x: r.minX, y: r.minY + h * 0.58),
                             control1: CGPoint(x: r.minX + w * 0.20, y: r.maxY),
                             control2: CGPoint(x: r.minX, y: r.minY + h * 0.88))
                  p.addCurve(to: CGPoint(x: r.midX, y: r.minY),
                             control1: CGPoint(x: r.minX, y: r.minY + h * 0.26),
                             control2: CGPoint(x: r.minX + w * 0.10, y: r.minY))
                  p.closeSubpath()
                  return p
              }
          }

          /// Four-pointed cartoon sparkle.
          struct Sparkle: Shape {
              func path(in r: CGRect) -> Path {
                  let c = CGPoint(x: r.midX, y: r.midY), a = r.width / 2, b = r.height / 2, k: CGFloat = 0.18
                  var p = Path()
                  p.move(to: CGPoint(x: c.x, y: c.y - b))
                  p.addQuadCurve(to: CGPoint(x: c.x + a, y: c.y), control: CGPoint(x: c.x + a * k, y: c.y - b * k))
                  p.addQuadCurve(to: CGPoint(x: c.x, y: c.y + b), control: CGPoint(x: c.x + a * k, y: c.y + b * k))
                  p.addQuadCurve(to: CGPoint(x: c.x - a, y: c.y), control: CGPoint(x: c.x - a * k, y: c.y + b * k))
                  p.addQuadCurve(to: CGPoint(x: c.x, y: c.y - b), control: CGPoint(x: c.x - a * k, y: c.y - b * k))
                  p.closeSubpath()
                  return p
              }
          }

          /// Cartoon ink colour for outlines.
          let inkLine = Color(red: 0.17, green: 0.11, blue: 0.24)

          /// Layout of the toy, shared by the static shell and the live parts on top.
          struct ShellMetrics {
              let w: CGFloat
              var scale: CGFloat = 3
              var eggH: CGFloat { w * 1.14 }
              var loopH: CGFloat { w * 0.16 }
              var totalH: CGFloat { eggH + loopH }
              var line: CGFloat { max(2.5, w * 0.018) }
              /// LCD size, snapped so each of its 128 pixels covers a whole number of
              /// device pixels (crisp, even pixels).
              var screen: CGFloat {
                  let ideal = w * 0.55 * scale
                  var per = max(1, (ideal / 128).rounded())
                  if per > 1 && per * 128 / scale > w * 0.55 * 1.06 { per -= 1 }   // must fit its frame
                  return per * 128 / scale
              }
              var bezel: CGFloat { w * 0.55 * 1.15 }
              var button: CGFloat { w * 0.135 }
              var buttonGap: CGFloat { w * 0.085 }
              /// Centre of the screen, from the top of the whole toy.
              var screenY: CGFloat { loopH + eggH * 0.415 }
              var buttonsY: CGFloat { loopH + eggH * 0.785 }
          }

          /// Everything that never changes while you play: drawn once and cached.
          struct ShellArt: View, Equatable {
              let theme: Theme
              let m: ShellMetrics

              static func == (a: ShellArt, b: ShellArt) -> Bool { a.theme == b.theme && a.m.w == b.m.w && a.m.scale == b.m.scale }

              var body: some View {
                  let w = m.w
                  let h = m.eggH
                  let lw = m.line
                  ZStack(alignment: .top) {
                      // ball-chain loop on top
                      ZStack {
                          Circle().stroke(inkLine, lineWidth: lw * 2.6)
                          Circle().stroke(Color(white: 0.92), lineWidth: lw * 1.2)
                      }
                      .frame(width: w * 0.15, height: w * 0.15)
                      .offset(y: 0)
                      Capsule()
                          .fill(theme.bottom)
                          .overlay(Capsule().stroke(inkLine, lineWidth: lw))
                          .frame(width: w * 0.16, height: w * 0.09)
                          .offset(y: m.loopH - w * 0.05)

                      // the egg
                      ZStack {
                          // ground shadow
                          Ellipse().fill(Color.black.opacity(0.18))
                              .frame(width: w * 0.8, height: w * 0.12)
                              .blur(radius: w * 0.025)
                              .offset(y: h * 0.52)
                          // cel shading: darker crescent bottom-right, body on top
                          EggShape().fill(theme.bottom.opacity(0.9)).overlay(EggShape().fill(Color.black.opacity(0.14)))
                          EggShape()
                              .fill(LinearGradient(colors: [theme.top, theme.bottom], startPoint: .top, endPoint: .bottom))
                              .frame(width: w * 0.95, height: h * 0.95)
                              .offset(x: -w * 0.022, y: -h * 0.022)
                          EggShape().stroke(inkLine, lineWidth: lw)
                          // rim of the front plate
                          EggShape()
                              .stroke(Color.white.opacity(0.55), style: StrokeStyle(lineWidth: lw * 0.8, lineCap: .round, dash: [lw * 0.1, lw * 1.6], dashPhase: 0))
                              .frame(width: w * 0.88, height: h * 0.88)
                          // gloss
                          Ellipse().fill(Color.white.opacity(0.75))
                              .frame(width: w * 0.22, height: h * 0.075)
                              .rotationEffect(.degrees(-28))
                              .offset(x: -w * 0.27, y: -h * 0.36)
                          Circle().fill(Color.white.opacity(0.85))
                              .frame(width: w * 0.045)
                              .offset(x: -w * 0.13, y: -h * 0.41)
                          // decorations
                          Sparkle().fill(Color.white).overlay(Sparkle().stroke(inkLine, lineWidth: lw * 0.45))
                              .frame(width: w * 0.08, height: w * 0.1)
                              .offset(x: w * 0.36, y: -h * 0.24)
                          Sparkle().fill(theme.button).overlay(Sparkle().stroke(inkLine, lineWidth: lw * 0.4))
                              .frame(width: w * 0.05, height: w * 0.065)
                              .offset(x: w * 0.30, y: -h * 0.33)
                          Image(systemName: "heart.fill")
                              .font(.system(size: w * 0.055))
                              .foregroundStyle(theme.button)
                              .shadow(color: inkLine, radius: 0, x: lw * 0.35, y: lw * 0.35)
                              .offset(x: -w * 0.38, y: h * 0.12)
                          // speaker holes
                          HStack(spacing: w * 0.022) {
                              ForEach(0..<3, id: \.self) { _ in Circle().fill(inkLine.opacity(0.55)).frame(width: w * 0.022) }
                          }
                          .offset(y: h * 0.445)
                          // screen bezel
                          RoundedRectangle(cornerRadius: m.bezel * 0.26, style: .continuous)
                              .fill(LinearGradient(colors: [Color.white.opacity(0.95), theme.top], startPoint: .top, endPoint: .bottom))
                              .overlay(RoundedRectangle(cornerRadius: m.bezel * 0.26, style: .continuous).stroke(inkLine, lineWidth: lw))
                              .frame(width: m.bezel, height: m.bezel)
                              .offset(y: m.screenY - m.loopH - h / 2)
                          RoundedRectangle(cornerRadius: m.w * 0.066, style: .continuous)
                              .fill(Color(red: 0.12, green: 0.10, blue: 0.18))
                              .overlay(RoundedRectangle(cornerRadius: m.w * 0.066, style: .continuous).stroke(inkLine, lineWidth: lw * 0.8))
                              .frame(width: m.w * 0.55 * 1.08, height: m.w * 0.55 * 1.08)
                              .offset(y: m.screenY - m.loopH - h / 2)
                      }
                      .frame(width: w, height: h)
                      .offset(y: m.loopH)
                  }
                  .frame(width: w, height: m.totalH, alignment: .top)
              }
          }

          struct ToyView: View {
              @EnvironmentObject var model: AppModel
              @EnvironmentObject var emu: Emulator
              @AppStorage("showHints") private var showHints = true
              @State private var showSettings = false
              @State private var wiggle = false
              @State private var restoreError = false
              @Environment(\.displayScale) private var displayScale

              var body: some View {
                  let theme = Theme.of(emu.toy?.color ?? 0)
                  GeometryReader { geo in
                      let room = geo.size.height - 64 - (showHints ? 44 : 0)
                      let m = ShellMetrics(w: min(geo.size.width - 8, room / 1.30, 640), scale: displayScale)
                      ZStack {
                          LinearGradient(colors: [theme.top.opacity(0.45), theme.bottom.opacity(0.7)],
                                         startPoint: .top, endPoint: .bottom)
                              .ignoresSafeArea()
                          VStack(spacing: 0) {
                              topBar(theme)
                              Spacer(minLength: 0)
                              toy(theme, m)
                                  .rotationEffect(.degrees(wiggle ? 2.5 : 0), anchor: .top)
                              Spacer(minLength: 0)
                              if showHints { hint(theme).padding(.bottom, 6) }
                          }
                          .frame(maxWidth: .infinity)
                          .padding(.horizontal, 6)

                          if let t = emu.toast {
                              VStack {
                                  Text(t)
                                      .font(.system(.callout, design: .rounded).weight(.semibold))
                                      .multilineTextAlignment(.center)
                                      .padding(.horizontal, 18).padding(.vertical, 12)
                                      .background(Capsule().fill(.ultraThickMaterial))
                                      .shadow(radius: 8)
                                      .padding(.top, 60).padding(.horizontal, 20)
                                      .onTapGesture { emu.toast = nil }
                                  Spacer()
                              }
                              .transition(.move(edge: .top).combined(with: .opacity))
                          }
                          if let s = emu.stopped { stoppedCard(s, theme) }
                      }
                      .animation(.spring(), value: emu.toast)
                  }
                  .sheet(isPresented: $showSettings) { SettingsView().environmentObject(model).environmentObject(emu) }
                  .onChange(of: emu.calling) { c in
                      guard c else { return }
                      withAnimation(.easeInOut(duration: 0.09).repeatCount(8, autoreverses: true)) { wiggle = true }
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.8) { withAnimation { wiggle = false } }
                  }
                  .confirmationDialog("Restore this backup?", isPresented: Binding(get: { model.pendingBackup != nil }, set: { if !$0 { model.pendingBackup = nil } }), titleVisibility: .visible) {
                      Button("Restore", role: .destructive) {
                          if let u = model.pendingBackup, let d = try? ToyStore.readPicked(u) {
                              restoreError = !emu.restoreBackup(d)
                          }
                          model.pendingBackup = nil
                      }
                      Button("Cancel", role: .cancel) { model.pendingBackup = nil }
                  } message: {
                      Text("This replaces \(emu.toy?.name ?? "your toy")'s current state with the backup. (Console command \"restorebak\" undoes it.)")
                  }
                  .alert("That backup doesn't fit this toy", isPresented: $restoreError) {
                      Button("OK", role: .cancel) {}
                  } message: {
                      Text("It was made with a different ROM version. Switch to the matching toy first, then restore it.")
                  }
              }

              private func topBar(_ theme: Theme) -> some View {
                  HStack {
                      VStack(alignment: .leading, spacing: 0) {
                          Text(emu.toy?.name ?? "TamaiOS")
                              .font(.system(.title3, design: .rounded).weight(.heavy))
                          if let r = emu.toy?.romName {
                              Text(r).font(.system(.caption2, design: .rounded)).opacity(0.7)
                          }
                      }
                      Spacer()
                      Button { showSettings = true } label: {
                          Image(systemName: "gearshape.fill")
                              .font(.system(size: 18, weight: .bold))
                              .padding(10)
                              .background(Circle().fill(.ultraThinMaterial))
                      }
                      .accessibilityLabel("Settings")
                  }
                  .foregroundStyle(theme.ink)
                  .padding(.horizontal, 10)
                  .padding(.top, 4)
                  .frame(height: 56)
              }

              /// The whole toy: cached art, the live LCD, and the buttons.
              private func toy(_ theme: Theme, _ m: ShellMetrics) -> some View {
                  ZStack(alignment: .top) {
                      ShellArt(theme: theme, m: m)
                          .equatable()
                          .drawingGroup()
                      screenView(m)
                          .offset(y: m.screenY - m.screen / 2)
                      buttons(theme, m)
                          .offset(y: m.buttonsY - m.button / 2)
                  }
                  .frame(width: m.w, height: m.totalH, alignment: .top)
              }

              private func screenView(_ m: ShellMetrics) -> some View {
                  let size = m.screen
                  return ZStack {
                      LCDView(sink: emu.frames)
                      if emu.loading {
                          Color.black
                          VStack(spacing: 10) {
                              ProgressView().tint(.white)
                              Text("Waking up…").font(.system(.caption, design: .rounded)).foregroundStyle(.white.opacity(0.8))
                          }
                      } else if emu.dark {
                          Color.black
                          Text("z z z").font(.system(size: size * 0.09, weight: .bold, design: .rounded))
                              .foregroundStyle(.white.opacity(0.25))
                      }
                  }
                  .frame(width: size, height: size)
                  .clipShape(RoundedRectangle(cornerRadius: size * 0.05, style: .continuous))
                  .accessibilityLabel("Toy screen")
              }

              private func buttons(_ theme: Theme, _ m: ShellMetrics) -> some View {
                  let d = m.button
                  return HStack(alignment: .top, spacing: m.buttonGap) {
                      ToyButton(label: "A", size: d, theme: theme, line: m.line) { emu.press(.a) } up: { emu.release(.a) }
                      ToyButton(label: "B", size: d, theme: theme, line: m.line) { emu.press(.b) } up: { emu.release(.b) }
                          .offset(y: d * 0.26)
                      ToyButton(label: "C", size: d, theme: theme, line: m.line) { emu.press(.c) } up: { emu.release(.c) }
                  }
              }

              private func hint(_ theme: Theme) -> some View {
                  HStack(spacing: 14) {
                      Text("**A** choose").fixedSize()
                      Text("**B** OK").fixedSize()
                      Text("**C** back").fixedSize()
                      Button { withAnimation { showHints = false } } label: { Image(systemName: "xmark.circle.fill") }
                  }
                  .font(.system(.footnote, design: .rounded))
                  .foregroundStyle(theme.ink.opacity(0.85))
                  .padding(.horizontal, 14).padding(.vertical, 8)
                  .background(Capsule().fill(.ultraThinMaterial))
              }

              private func stoppedCard(_ s: StopInfo, _ theme: Theme) -> some View {
                  ZStack {
                      Color.black.opacity(0.35).ignoresSafeArea()
                      VStack(spacing: 14) {
                          Image(systemName: "exclamationmark.triangle.fill").font(.system(size: 40)).foregroundStyle(.orange)
                          Text(s.title).font(.system(.title3, design: .rounded).weight(.bold))
                          Text("Restarting is like taking the batteries out — your pet and its progress are kept.")
                              .font(.system(.callout, design: .rounded)).multilineTextAlignment(.center).foregroundStyle(.secondary)
                          BigButton(title: "Restart toy", icon: "arrow.clockwise", theme: theme) { emu.restart() }
                          Button("Reload last autosave") { emu.reload() }
                          Button("Open Console") { showSettings = true }
                              .font(.system(.footnote, design: .rounded))
                      }
                      .padding(24)
                      .background(RoundedRectangle(cornerRadius: 26, style: .continuous).fill(.regularMaterial))
                      .padding(30)
                  }
              }
          }

          /// A cartoon button that reacts on touch-down (no gesture delay).
          struct ToyButton: View {
              let label: String
              let size: CGFloat
              let theme: Theme
              let line: CGFloat
              let down: () -> Void
              let up: () -> Void
              @State private var pressed = false
              @AppStorage("haptics") private var haptics = true

              var body: some View {
                  VStack(spacing: size * 0.08) {
                      ZStack {
                          Circle().fill(inkLine.opacity(0.35))
                              .offset(y: size * 0.07)
                          Circle()
                              .fill(RadialGradient(colors: [Color.white.opacity(0.6), theme.button], center: UnitPoint(x: 0.32, y: 0.28), startRadius: 0, endRadius: size * 0.55))
                              .overlay(Circle().fill(Color.black.opacity(pressed ? 0.12 : 0)))
                              .overlay(Circle().stroke(inkLine, lineWidth: line))
                              .offset(y: pressed ? size * 0.06 : 0)
                      }
                      .frame(width: size, height: size)
                      .overlay(
                          TouchPad(down: {
                              pressed = true
                              if haptics { Haptics.tap() }
                              down()
                          }, up: {
                              pressed = false
                              up()
                          })
                          .frame(width: size * 1.5, height: size * 1.6)
                      )
                      Text(label)
                          .font(.system(size: size * 0.24, weight: .heavy, design: .rounded))
                          .foregroundStyle(inkLine.opacity(0.75))
                          .allowsHitTesting(false)
                  }
                  .accessibilityElement()
                  .accessibilityLabel("Button \(label)")
                  .accessibilityAddTraits(.isButton)
                  .accessibilityAction { down(); DispatchQueue.main.asyncAfter(deadline: .now() + 0.15) { up() } }
              }
          }
          TAMA_EOF
          echo "Wrote $(ls -R ffi ios tools | wc -l) entries"

      - name: Build in your firmware (firmware/*.bin, if you added one)
        run: |
          f=$(ls firmware/*.bin 2>/dev/null | head -1 || true)
          if [ -n "$f" ]; then
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -lt 8388608 ]; then echo "::error::$f is $size bytes; a Tamagotchi ON dump is 8 MB (8388608 bytes)"; exit 1; fi
            cp "$f" ios/TamaiOS/Firmware.bin
            echo "Built in $f ($size bytes) - the app will open straight to this toy"
          else
            echo "No firmware/*.bin in the repo - the app will ask you to pick a ROM"
          fi

      - name: Get the emulator core (tg18-emu by oreo-fox, MIT licence)
        run: |
          git clone https://github.com/oreo-fox/tg18-emu upstream
          git -C upstream checkout 41204c92e98a8882d5c90a9876d8990f3b63e285

      - name: Build the emulator core for iPhone
        run: |
          rustup target add aarch64-apple-ios
          cd ffi
          IPHONEOS_DEPLOYMENT_TARGET=16.0 cargo build --release --target aarch64-apple-ios
          mkdir -p ../ios/lib
          cp target/aarch64-apple-ios/release/libtamaios.a ../ios/lib/
          ls -la ../ios/lib

      - name: Draw the app icon
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 tools/icon.py ios/TamaiOS/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build the app
        run: |
          cd ios
          xcodebuild -project TamaiOS.xcodeproj -scheme TamaiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build

      - name: Package the IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TamaiOS.app Payload/
          zip -qry TamaiOS.ipa Payload
          ls -la TamaiOS.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: TamaiOS-ipa
          path: ios/TamaiOS.ipa
          if-no-files-found: error
