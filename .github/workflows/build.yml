                d.line(pts, fill=INK, width=int(u(3)))
                for i in range(10):
                    (x0, y0), (x1, y1) = pts[i], pts[i + 1]
                    mx = (x0 + x1) / 2
                    d.polygon([(x0 + u(4), y0), (x1 - u(4), y1), (mx, (y0 + y1) / 2 + u(34))], fill=[(255, 120, 170), (255, 220, 110), (130, 200, 255), (190, 150, 255)][i % 4])
