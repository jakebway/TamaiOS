        SIZE = int(sys.argv[2]) if len(sys.argv) > 2 else 1024
        SS = 4
        S = SIZE * SS

        INK = (58, 36, 78)
        SHELL_T, SHELL_B = (255, 214, 232), (247, 132, 182)
        FRAME_T, FRAME_B = (180, 228, 255), (110, 170, 250)
        BTN_T, BTN_B = (255, 246, 190), (250, 205, 90)
        BG_T, BG_B = (255, 241, 247), (233, 218, 255)

