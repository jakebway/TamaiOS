name: Headless firmware smoke audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Prepare pinned patched core
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/oreo-fox/tg18-emu upstream
          git -C upstream checkout 41204c92e98a8882d5c90a9876d8990f3b63e285
          git -C upstream apply ../patches/radio.patch
          git -C upstream apply ../patches/ir_partner.patch
          cargo build --locked --release --manifest-path upstream/Cargo.toml -p tg18-core --bin tg18cli
      - name: Run isolated fresh-boot smoke checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess, tempfile
          root = pathlib.Path.cwd()
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          report = {
              'scope': 'Fresh boot smoke only; no notification, Bluetooth, IR, save-resume or iOS claims',
              'app_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'core_commit': subprocess.check_output(['git', '-C', 'upstream', 'rev-parse', 'HEAD'], text=True).strip(),
              'patches': {str(p): digest(p) for p in sorted(pathlib.Path('patches').glob('*.patch'))},
              'runs': []
          }
          roms = sorted(pathlib.Path('firmware').glob('*.bin'))
          failed = not roms
          runner = root / 'upstream/target/release/tg18cli'
          for rom in roms:
              row = {'firmware': rom.name, 'sha256': digest(rom)}
              try:
                  with tempfile.TemporaryDirectory(prefix='tamaios-smoke-') as work:
                      result = subprocess.run([str(runner), str(rom.resolve()), '--seconds', '10', '--date', '2026-11-09 12:00', '--quiet', '--screenshot', 'screen.png'], cwd=work, capture_output=True, text=True, timeout=120)
                  match = re.search(r'=== result: (.*?) after ', result.stdout)
                  outcome = match.group(1) if match else None
                  row.update(exit_code=result.returncode, outcome=outcome)
                  row['passed'] = result.returncode == 0 and outcome is not None and 'crash' not in outcome.lower() and 'fault:' not in result.stdout.lower()
              except Exception as exc:
                  row.update(passed=False, error_type=type(exc).__name__)
              failed = failed or not row['passed']
              report['runs'].append(row)
          report['status'] = 'failed' if failed else 'smoke-passed'
          if not roms:
              report['reason'] = 'No firmware/*.bin files available; no tests executed. Private firmware retrieval is not configured in this workflow.'
          pathlib.Path('audit-results/summary.json').write_text(json.dumps(report, indent=2) + '\n')
          raise SystemExit(1 if failed else 0)
          PY
      - name: Upload non-sensitive summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke-summary
          path: audit-results/summary.json
          if-no-files-found: warn
          retention-days: 7
