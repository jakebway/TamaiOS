name: Headless firmware smoke audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Prepare pinned patched core
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/oreo-fox/tg18-emu upstream
          git -C upstream checkout 41204c92e98a8882d5c90a9876d8990f3b63e285
          git -C upstream apply ../patches/radio.patch
          git -C upstream apply ../patches/ir_partner.patch
          cargo build --locked --release --manifest-path upstream/Cargo.toml -p tg18-core --bin tg18cli
      - name: Native timer and same-checkpoint regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/core/tests audit-results
          cp tools/native_timer_audit.rs upstream/core/tests/tamaios_timer_audit.rs
          TAMAIOS_AUDIT_FIRMWARE="$GITHUB_WORKSPACE/firmware" timeout 300 cargo test --locked --release --manifest-path upstream/Cargo.toml -p tg18-core --test tamaios_timer_audit -- --nocapture --test-threads=1 2>&1 | tee audit-results/native-tests.txt
      - name: Run snapshot validation and timer diagnostics
        if: always()
        run: python3 tools/timer_diagnostics.py
      - name: Upload diagnostic summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke-summary
          path: |
            audit-results/summary.json
            audit-results/native-tests.txt
          if-no-files-found: warn
          retention-days: 7
