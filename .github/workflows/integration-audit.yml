name: Real FFI and iOS integration audit
on:
  workflow_dispatch:
  push:
    branches: [audit/firmware-grounded-validation]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: ffi
            os: ubuntu-latest
          - kind: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Run integration group
        run: python3 tools/run_integration_audit.py ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.kind }}
          path: integration-results/
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: integration-*
          path: reports
          merge-multiple: true
      - name: Publish integration results
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_RESULT: ${{ needs.checks.result }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          groups = {}
          for kind in ['ffi', 'ios']:
              p = pathlib.Path('reports') / (kind + '.json')
              groups[kind] = json.loads(p.read_text()) if p.exists() else {'passed': False, 'error': 'No report produced; inspect startup/checkout/upload'}
          report = {'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'matrix_result': os.environ['MATRIX_RESULT'], 'groups': groups, 'limits': 'No merge, no app installation, no paired gameplay or notification delivery guarantee. No firmware, snapshots or app binaries published.'}
          body = pathlib.Path('integration-report.md')
          body.write_text('```json\n' + json.dumps(report, indent=2) + '\n```\n')
          subprocess.run(['gh', 'issue', 'create', '--repo', os.environ['GITHUB_REPOSITORY'], '--title', 'TamaiOS integration audit ' + os.environ['GITHUB_SHA'][:12] + ' run ' + os.environ['GITHUB_RUN_ID'] + '.' + os.environ['GITHUB_RUN_ATTEMPT'], '--body-file', str(body)], check=True)
          PY
