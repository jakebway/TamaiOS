name: CI-only stopped timer snapshot candidate
on:
  workflow_dispatch:
  push:
    branches: [audit/firmware-grounded-validation]
    paths:
      - tools/timer_snapshot_history.patch
      - tools/native_timer_audit.rs
      - tools/headless_audit.py
      - tools/timer_diagnostics.py
      - .github/workflows/timer-candidate-audit.yml
permissions:
  contents: read
  issues: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Prepare isolated candidate core
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          git clone https://github.com/oreo-fox/tg18-emu upstream
          git -C upstream checkout 41204c92e98a8882d5c90a9876d8990f3b63e285
          git -C upstream apply ../patches/radio.patch
          git -C upstream apply ../patches/ir_partner.patch
          git -C upstream apply --check ../tools/timer_snapshot_history.patch
          git -C upstream apply ../tools/timer_snapshot_history.patch
          cargo build --locked --release --manifest-path upstream/Cargo.toml -p tg18-core --bin tg18cli
          mkdir -p upstream/core/tests
          cp tools/native_timer_audit.rs upstream/core/tests/tamaios_timer_audit.rs
      - name: Timer boundaries, pending interrupts, restart and same-checkpoint continuation
        id: timer
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          TAMAIOS_AUDIT_FIRMWARE="$GITHUB_WORKSPACE/firmware" timeout 300 cargo test --locked --release --manifest-path upstream/Cargo.toml -p tg18-core --test tamaios_timer_audit -- --nocapture --test-threads=1 2>&1 | tee audit-results/timer-tests.txt
      - name: Unchanged strict snapshot checks and field-level diagnostics
        id: snapshot
        if: always() && steps.prepare.outcome == 'success'
        run: python3 tools/timer_diagnostics.py
      - name: Publish explicitly isolated candidate results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE: ${{ steps.prepare.outcome }}
          TIMER: ${{ steps.timer.outcome }}
          SNAPSHOT: ${{ steps.snapshot.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('audit-results')
          root.mkdir(exist_ok=True)
          summary = root / 'summary.json'
          source = json.loads(summary.read_text()) if summary.exists() else {}
          steps = {name: os.environ.get(name, 'unknown') for name in ['PREPARE', 'TIMER', 'SNAPSHOT']}
          diagnostics = source.get('timer_diagnostics', {})
          runs = source.get('runs', [])
          passed = all(value == 'success' for value in steps.values()) and source.get('status') == 'passed' and len(runs) == 3 and diagnostics.get('completed') is True
          report = {'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'variant': 'CI-only stopped-timer history candidate', 'baseline_reference_issue': 32, 'scope': 'Candidate is applied only in this job, not the app build. Existing strict comparisons are unchanged. No gameplay, connection persistence or phone lifecycle claim.', 'steps': steps, 'passed': passed, 'strict_snapshot_status': source.get('status'), 'firmware_checks': runs, 'timer_diagnostics': diagnostics, 'core_commit': source.get('core_commit')}
          paths = [pathlib.Path('patches/radio.patch'), pathlib.Path('patches/ir_partner.patch'), pathlib.Path('tools/timer_snapshot_history.patch')]
          report['applied_patch_sha256'] = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          log = root / 'timer-tests.txt'
          report['native_result_lines'] = [line for line in log.read_text(errors='replace').splitlines() if line.startswith('test result:') or line.startswith('same-checkpoint continuation passed:')] if log.exists() else []
          (root / 'candidate-report.json').write_text(json.dumps(report, indent=2) + '\n')
          body = root / 'candidate-report.md'
          body.write_text('```json\n' + json.dumps(report, indent=2) + '\n```\n')
          subprocess.run(['gh', 'issue', 'create', '--repo', os.environ['GITHUB_REPOSITORY'], '--title', 'TamaiOS CI-only timer candidate ' + os.environ['GITHUB_SHA'][:12] + ' run ' + os.environ['GITHUB_RUN_ID'] + '.' + os.environ['GITHUB_RUN_ATTEMPT'], '--body-file', str(body)], check=True)
          raise SystemExit(0 if passed else 1)
          PY
      - name: Upload text diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timer-candidate-summary
          path: audit-results/
          if-no-files-found: warn
          retention-days: 7
