name: TamaiOS
options:
  bundleIdPrefix: com.jakebway
  deploymentTarget:
    iOS: "16.0"
targets:
  TamaiOS:
    type: application
    platform: iOS
    sources:
      - path: TamaiOS
        excludes: ["BundledFirmware", "BundledAssets"]
      - path: TamaiOS/BundledFirmware
        type: folder
        buildPhase: resources
      - path: TamaiOS/BundledAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakebway.tamaios
        PRODUCT_NAME: TamaiOS
        INFOPLIST_FILE: TamaiOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: TamaiOS/Bridge.h
        SWIFT_VERSION: "5.0"
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/lib
        OTHER_LDFLAGS: -ltamaios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "beta"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES